name: CI/CD

# The whole gate on a clean machine (every pull request and every push to main), and the release (a push to main whose
# commits since the last version tag hold a `feat` or a `fix`). Standard GitHub-hosted runners are free for a public
# repository: https://docs.github.com/en/billing/concepts/product-billing/github-actions

on:
    pull_request:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    GITLEAKS_VERSION: 8.30.1
    GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
    check-skip-ci:
        runs-on: ubuntu-24.04
        outputs:
            skip_ci: ${{ steps.check.outputs.skip_ci }}
            should_release: ${{ steps.release.outputs.should_release }}
            from: ${{ steps.range.outputs.from }}
            to: ${{ steps.range.outputs.to }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}

            # The last commit's subject decides: a commit of documents only ends its subject with [skip ci].
            - name: Check for the skip-ci marker
              id: check
              run: |
                  if [ "${{ github.event_name }}" != "workflow_dispatch" ] && git log -1 --pretty=%s | grep -qF "[skip ci]"; then
                    echo "skip_ci=true" >> "$GITHUB_OUTPUT"
                    echo "The last commit's subject holds [skip ci]: the run ends here."
                  else
                    echo "skip_ci=false" >> "$GITHUB_OUTPUT"
                  fi

            # The commits this run judges: the pull request's own, or the ones this push added.
            - name: The range of pushed commits
              id: range
              run: |
                  if [ "${{ github.event_name }}" = "pull_request" ]; then
                    FROM="${{ github.event.pull_request.base.sha }}"
                    TO="${{ github.event.pull_request.head.sha }}"
                  else
                    FROM="${{ github.event.before }}"
                    TO="${{ github.sha }}"
                    if [ -z "$FROM" ] || [ "$FROM" = "0000000000000000000000000000000000000000" ] \
                       || ! git cat-file -e "$FROM^{commit}" 2>/dev/null; then
                      FROM="$(git rev-list --max-parents=0 HEAD | tail -1)"
                    fi
                  fi
                  echo "from=$FROM" >> "$GITHUB_OUTPUT"
                  echo "to=$TO" >> "$GITHUB_OUTPUT"
                  echo "Commits judged: $FROM..$TO"

            - name: Is a release due
              id: release
              run: |
                  if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.ref }}" != "refs/heads/main" ]; then
                    echo "should_release=false" >> "$GITHUB_OUTPUT"; exit 0
                  fi
                  LAST_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo "")
                  if [ -z "$LAST_TAG" ]; then SUBJECTS=$(git log --pretty=%s); else SUBJECTS=$(git log "${LAST_TAG}..HEAD" --pretty=%s); fi
                  if echo "$SUBJECTS" | grep -qE '^(feat|fix)(\([^)]*\))?:'; then
                    echo "should_release=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "should_release=false" >> "$GITHUB_OUTPUT"
                  fi

    gate:
        runs-on: ubuntu-24.04
        needs: check-skip-ci
        if: needs.check-skip-ci.outputs.skip_ci == 'false'
        timeout-minutes: 40
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}

            - name: Secret scan of the pushed commits
              run: |
                  ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
                  curl -sSfL -o "$ARCHIVE" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ARCHIVE}"
                  echo "${GITLEAKS_SHA256}  ${ARCHIVE}" | sha256sum -c -
                  tar -xzf "$ARCHIVE" gitleaks
                  ./gitleaks detect --redact --no-banner --config .gitleaks.toml \
                    --log-opts="${{ needs.check-skip-ci.outputs.from }}..${{ needs.check-skip-ci.outputs.to }}"
                  rm -f gitleaks "$ARCHIVE"

            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Install the interface's packages
              run: pnpm install --frozen-lockfile

            - name: Commit messages of the pushed commits
              run: |
                  pnpm exec commitlint --from "${{ needs.check-skip-ci.outputs.from }}" \
                    --to "${{ needs.check-skip-ci.outputs.to }}" --verbose

            - name: Install the Go tools
              run: pnpm tools:install

            - name: Install the browser for the browser tests
              run: pnpm exec playwright install --with-deps chromium

            - name: Generate, lint, type checks, tests with coverage, build
              run: pnpm precommit

            - name: Browser tests
              run: pnpm test:e2e

            - name: Keep the reports
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: reports-${{ github.run_id }}
                  path: |
                      coverage/
                      playwright-report/
                      test-results/
                  if-no-files-found: ignore
                  retention-days: 14

    # The installer and the updater of this commit, on clean machines with systemd, against a test certificate authority
    # (Pebble) and a local server of release files signed with a key made for the run (Plan 2, section L). Nothing here
    # calls the real Let's Encrypt, the real release address or a marketplace. It also records the wyo server's memory and
    # the program's size in the job's summary.
    installer:
        runs-on: ${{ matrix.os }}
        needs: check-skip-ci
        if: needs.check-skip-ci.outputs.skip_ci == 'false'
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-24.04, ubuntu-22.04, ubuntu-24.04-arm]
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}

            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Install the interface's packages
              run: pnpm install --frozen-lockfile

            - name: Build the interface the wyo server carries
              run: pnpm exec vite build

            - name: Build the test programs
              run: bash scripts/ci/installer-job.sh build

            # As root: the installer writes system units and listens on ports 80 and 443. -E keeps the job's folders.
            - name: Run the installer and check what it did
              run: sudo -E env "PATH=$PATH" bash scripts/ci/installer-job.sh run

    release:
        runs-on: ubuntu-24.04
        needs: [check-skip-ci, gate, installer]
        if: needs.check-skip-ci.outputs.should_release == 'true'
        outputs:
            version: ${{ steps.version.outputs.version }}
        concurrency:
            group: release
            cancel-in-progress: false
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: main

            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Install the interface's packages
              run: pnpm install --frozen-lockfile

            - name: The next version and its change log
              id: version
              run: |
                  pnpm release
                  VERSION=$(node -p "require('./package.json').version")
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                  # The version's own part of CHANGELOG.md: from its heading to the next version's heading.
                  awk -v v="$VERSION" '
                    /^#{2,3} / { if (found) exit; if (index($0, v)) { found = 1; next } }
                    found { print }
                  ' CHANGELOG.md > release-notes.md
                  test -s release-notes.md || echo "Release $VERSION." > release-notes.md

            - name: Build the wyo server for linux/amd64 and linux/arm64
              run: |
                  VERSION="${{ steps.version.outputs.version }}"
                  pnpm exec vite build
                  mkdir -p release
                  for ARCH in amd64 arm64; do
                    CGO_ENABLED=0 GOOS=linux GOARCH="$ARCH" go build -trimpath \
                      -ldflags "-s -w -X github.com/prankyman/wyo/internal/version.Version=${VERSION}" \
                      -o "release/wyo_linux_${ARCH}" ./cmd/wyo
                  done
                  cp scripts/install.sh release/install.sh
                  printf '%s\n' "$VERSION" > release/VERSION
                  # The list covers the four files; it is signed in the next step.
                  (cd release && sha256sum wyo_linux_amd64 wyo_linux_arm64 install.sh VERSION > checksums.txt)

            # The signature of the list is what the installer and the updater check first. The private key is the
            # repository's secret; it is written to a file only this step can read and never printed.
            - name: Sign the list of checksums and check the signature with the committed public key
              env:
                  RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
              run: |
                  test -n "$RELEASE_SIGNING_KEY" || { echo "The secret RELEASE_SIGNING_KEY is not set."; exit 1; }
                  KEY_FILE="$(mktemp)"
                  trap 'rm -f "$KEY_FILE"' EXIT
                  (umask 077 && printf '%s\n' "$RELEASE_SIGNING_KEY" > "$KEY_FILE")
                  openssl pkeyutl -sign -inkey "$KEY_FILE" -rawin -in release/checksums.txt -out release/checksums.txt.sig
                  # The release must be accepted by a key the wyo server and the installer carry; if none accepts it,
                  # nothing is published.
                  VERIFIED=no
                  for PUBLIC_KEY in internal/release/keys/*.pem; do
                    if openssl pkeyutl -verify -pubin -inkey "$PUBLIC_KEY" -rawin -in release/checksums.txt \
                         -sigfile release/checksums.txt.sig >/dev/null 2>&1; then
                      VERIFIED=yes
                    fi
                  done
                  test "$VERIFIED" = yes || { echo "The signature is not accepted by any committed public key."; exit 1; }
                  echo "The signature is accepted by a committed public key."

            # Only now, with the release built and signed, is the version committed and tagged: a missing secret stops the
            # release before anything is pushed. The gate job above ran every check; the hooks of .husky/ would only run them again, without the Go tools.
            - name: Commit and tag the version
              env:
                  HUSKY: 0
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add package.json CHANGELOG.md
                  git commit --no-verify -m "chore(release): ${{ steps.version.outputs.version }} [skip ci]"
                  git tag "v${{ steps.version.outputs.version }}"
                  git push --no-verify origin HEAD:main
                  git push --no-verify origin "v${{ steps.version.outputs.version }}"

            - name: Publish the GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  VERSION="${{ steps.version.outputs.version }}"
                  gh release create "v${VERSION}" --title "wyo ${VERSION}" --notes-file release-notes.md \
                    release/wyo_linux_amd64 release/wyo_linux_arm64 release/install.sh release/VERSION \
                    release/checksums.txt release/checksums.txt.sig

    # The released installer and the released wyo server, unchanged, run once against the real release address. A clean
    # machine of GitHub has no domain for a real certificate, so the installation is the one behind a web server
    # (--behind-proxy): the download, the signature, the checksums, the units and the owner's sign-in are what it proves.
    released-installer:
        runs-on: ubuntu-24.04
        needs: release
        timeout-minutes: 15
        steps:
            - name: Install the released wyo from the real release address
              env:
                  VERSION: ${{ needs.release.outputs.version }}
              run: |
                  set -euo pipefail
                  base=https://github.com/prankyman/wyo/releases/latest/download
                  # The "latest" address may lag a published release by a moment; wait until it names this version.
                  for _ in $(seq 1 30); do
                    latest="$(curl -fsSL "$base/VERSION" || true)"
                    [ "$latest" = "$VERSION" ] && break
                    sleep 10
                  done
                  test "$latest" = "$VERSION" || { echo "The latest release is $latest, not $VERSION."; exit 1; }
                  curl -fsSL -o install.sh "$base/install.sh"
                  password_file="$(mktemp)"
                  (umask 077 && printf '%s\n' 'released-check-password' > "$password_file")
                  sudo bash install.sh --behind-proxy --domain wyo-check.example.org --login owner \
                    --password-file "$password_file" --updates manual
                  rm -f "$password_file"

            - name: Check the installed wyo
              env:
                  VERSION: ${{ needs.release.outputs.version }}
              run: |
                  set -euo pipefail
                  test "$(/usr/local/bin/wyo version)" = "$VERSION"
                  test "$(systemctl show -p User --value wyo.service)" = wyo
                  systemctl is-active wyo.service
                  test "$(curl -fsS http://127.0.0.1:8484/healthz)" = ok
                  curl -fsS http://127.0.0.1:8484/readyz
                  status="$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
                    -d '{"login":"owner","password":"released-check-password"}' http://127.0.0.1:8484/api/v1/session)"
                  test "$status" = 200 || { echo "The owner's sign-in answered $status."; exit 1; }
                  echo "The released installer installed wyo $VERSION; the owner signs in." >> "$GITHUB_STEP_SUMMARY"
