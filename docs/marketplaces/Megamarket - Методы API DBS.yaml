      summary: Покупательские возвраты
      tags:
        - работа с возвратами
      responses:
        '200':
          description: Ok
          headers: {}
          content:
            application/json:
              schema:
                type: object
                x-examples:
                  Example 1:
                    data: {}
                    success: 1
                properties:
                  data:
                    type: object
                    description: Общий блок сданными
                  meta:
                    type: object
                    description: Дополнительный параметр
                  success:
                    type: integer
                    description: |
                      Успешность ответа

                      1 - успех
                      0 - ошибка
              examples:
                Example 1:
                  value:
                    data: {}
                    meta: {}
                    success: 1
        '400':
          description: Bad Request
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: integer
                  error:
                    type: object
                    properties:
                      errorText:
                        type: string
                      errorCode:
                        type: string
                x-examples:
                  Example 1:
                    success: 0
                    error:
                      errorText: Unexpected end of JSON input
                      errorCode: SyntaxError
              examples:
                Example 1:
                  value:
                    success: 0
                    error:
                      errorText: Unexpected end of JSON input
                      errorCode: SyntaxError
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: integer
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      code:
                        type: integer
                x-examples:
                  Example 1:
                    success: 0
                    error:
                      message: No valid token.
                      code: 401
              examples:
                Example 1:
                  value:
                    success: 0
                    error:
                      message: No valid token.
                      code: 401
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: integer
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      code:
                        type: integer
                x-examples:
                  Example 1:
                    success: 0
                    error:
                      message: Internal Server Error
                      code: 500
              examples:
                Example 1:
                  value:
                    success: 0
                    error:
                      message: Internal Server Error
                      code: 500
      operationId: post-order-return
      requestBody:
        content:
          application/json:
            schema:
              type: object
              x-examples:
                Example 1:
                  data:
                    shipments:
                      - shipmentId: '8866897345678'
                        returnReason: string
                        items:
                          - itemIndex: '1'
                            refundedAmount: 690
                          - itemIndex: '2'
                            refundedAmount: 830
                        outletId: 09ST
              required:
                - data
              properties:
                data:
                  type: object
                  required:
                    - shipments
                  description: |
                    Общий блок с данными
                  properties:
                    shipments:
                      type: array
                      description: |
                        Данные об отправлениях
                      items:
                        type: object
                        required:
                          - shipmentId
                          - returnReason
                          - items
                        properties:
                          shipmentId:
                            type: string
                            description: |
                              Идентификатор отправления Мегамаркета
                          returnReason:
                            type: string
                            description: |-
                              Причина возврата:

                              1. incompleted — неполная комплектация товаров в заказе; 

                              2. incorrected — товар не соответствует заказанному;

                              3. defected — неисправный товар (брак);

                              4. damaged — товар повреждён;

                              5. expired — у товара истёк срок годности;

                              6. used — есть признаки, что товар был использован; 

                              7. not_suitable — товар не подошёл или покупатель передумал покупать товар
                          items:
                            type: array
                            description: |
                              Данные о лотах
                            items:
                              type: object
                              required:
                                - itemIndex
                                - refundedAmount
                              properties:
                                itemIndex:
                                  type: string
                                  description: |
                                    Порядковый номер лота. Приходит в order/new при создании заказа
                                refundedAmount:
                                  type: number
                                  description: |
                                    Это объём денежных средств, который продавец вернул покупателю. Значение refundedAmount должно быть равно окончательной цене лота (finalPrice) из ответа метода order/get или order/new
                          outletId:
                            type: string
                            description: |
                              Место, куда вернули товар 
            examples:
              Example 1:
                value:
                  data:
                    shipments:
                      - shipmentId: '8866897345678'
                        returnReason: string
                        items:
                          - itemIndex: '1'
                            refundedAmount: 690
                          - itemIndex: '2'
                            refundedAmount: 830
                        outletId: 09ST
      description: |-
        Запрос выполняется от продавца к Мегамаркету. 

        Часть ошибок в рамках метода может прийти при успешном ответе 200.

        Возможные коды и значения: 

        - 1001 - ошибка валидации: Невалидное значение в поле 'returnReason', возможно одно из следующих значений: incompleted incorrected defected damaged expired used not_suitable 
        - 1002 - Отправление 8993011293864 пренадлежит другому продавцу
        - 1003 - Не удалось найти указанные отправления: [899301129386490909] 
        - 1004 - Статус лота с индексом 1 из отправления 8017334203627 Отменен, создание возврата невозможно 
        - 1005 - Для отправления 8017270340023 не найден лот с индексом 5 
        - 1006 - Найдены уже существующие заявки на возврат для отправления 8993011293864 лот с индексом 46467192310 
        - 1007 - Для лота с индексом 3 из отправления 8993120774328 указана цена возврата 51990, но ожидалась цена 7000.00 
        - 1008 - Возврат денежных средств покупателю производится Мегамаркетом 
        - 1009 - Лот с идентификатором 46467198621 уже возвращен или находится в процессе возврата (IssueID = ) 
        - 1010 - Возврат денежных средств покупателю возможен только по предоплаченным заказам 
        - 3001 - Лот 2 не в статусе DELIVERED (Доставлен), повторите позднее

components:
  schemas:
    orderGetRequest:
        type: object
        properties:
          data:
            type: object
            description: Объект с полезными данными
            properties:
              token:
                type: string
                description: Токен мерчанта
              shipments:
                type: array
                description: Массив номеров отправлений
                items:
                  type: string
            required:
              - token
              - shipments
        required:
          - data
    orderGetResponse:
        type: object
        properties:
          success:
            type: integer
            description: Признак успешности запроса
          data:
            type: object
            description: Объект с полезными данными
            properties:
              shipments:
                type: array
                description: Массив отправлений
                items:
                  type: object
                  properties:
                    shipmentId:
                      type: string
                      description: Идентификатор отправления в системе ММ
                    orderCode:
                      type: string
                      description: Идентификатор отправления в системе продавца
                    status:
                      type: string
                      description: |-
                        Состояние отправления

                        - NEW - ожидание подтверждения
                        - CONFIRMED - подтверждено продавцом
                        - PACKED - скомплектовано продавцом
                        - SHIPPED - отгружено продавцом
                        - DELIVERED - исполнение заказа 
                        - MERCHANT_CANCELED - отмена продавцом
                        - CUSTOMER_CANCELED - отмена покупателем
                    statusDate:
                      type: string
                      description: Дата установки текущего статуса
                    confirmedTimeLimit:
                      type: string
                      description: 'Дата и время, до которого должно быть произведно подтверждение заказа'
                    packingTimeLimit:
                      type: string
                      description: 'Дата и время, до которого должны быть произведна комплектации'
                    shippingTimeLimit:
                      type: string
                      description: 'Дата и время, до которого должны быть произведна отгрузка'
                    shipmentDateFrom:
                      type: string
                      description: Начало интервала отгрузки
                    shipmentDateTo:
                      type: string
                      description: Конец интервала отгрузки
                    packingDate:
                      type: string
                      description: Дата комплектации
                    reserveExpirationDate:
                      type: string
                      description: Окончание даты резерва
                    deliveryId:
                      type: string
                      description: Идентификатор доставки
                    customerOrderId:
                      type: string
                      description: Идентификатор заказа в системе ММ
                    shipmentDateShift:
                      type: boolean
                      description: Возможность изменения даты отгрузки
                    shipmentIsChangeable:
                      type: boolean
                      description: Возможность перекомлектации отправления
                    customerFullName:
                      type: string
                      description: Имя и фамилия покупателя
                    customerAddress:
                      type: string
                      description: Адрес покупателя
                    shippingPoint:
                      type: string
                      description: Идентификатор склада
                    creationDate:
                      type: string
                      description: Дата создания заказа
                    deliveryDate:
                      type: string
                      description: Дата доставки
                    deliveryDateFrom:
                      type: string
                      description: Начало интервала доставки
                    deliveryDateTo:
                      type: string
                      description: Конец интервала доставки
                    fulfillmentMethod:
                      type: string
                      description: Метод фулфилмента
                    items:
                      type: array
                      description: Массив лотов
                      items:
                        type: object
                        properties:
                          itemIndex:
                            type: string
                            description: Упрощенный идентификатор лота в отправлении
                          itemId:
                            type: string
                          status:
                            type: string
                            description: Состояние лота
                          subStatus:
                            type: string
                            description: Уточнение мерчантской отмены
                          statusDate:
                            type: string
                            description: Дата установки текущего статуса
                          price:
                            type: integer
                            description: Цена лота без учета лояльности
                          finalPrice:
                            type: integer
                            description: Цена лота с учетом лояльности
                          discounts:
                            type: array
                            description: Информация о примененной покупателем лояльности
                            items:
                              type: object
                              properties:
                                discountType:
                                  type: string
                                  description: Неуникальный идентификатор примененной скидки от МегаМаркета
                                discountDescription:
                                  type: string
                                  description: Описание
                                discountAmount:
                                  type: integer
                                  description: Сумма скидки
                          quantity:
                            type: integer
                            description: Количество
                          offerId:
                            type: string
                            description: Идентификатор товара в системе продавца
