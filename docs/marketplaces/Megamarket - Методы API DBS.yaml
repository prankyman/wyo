    orderSearchRequest:
        type: object
        properties:
          data:
            type: object
            description: Объект с полезными данными
            properties:
              token:
                type: string
                description: Токен мерчанта
              searchQuery:
                type: string
                description: |-
                  Идентификатор мультипоиска:

                  - по shipmentId - поле shipment_partititioned.id (без ограничения глубины поиска, если shippingDate, dateFrom и dateTo не заданы)
                  - orderCode -  поле shipment_partititioned.order_code
                  - deliveryId -  поле shipment_partititioned.delivery_id
                  - offerId -  поле shipment_partititioned.merchant_offer_Ids
              dateFrom:
                type: string
                description: |-
                  Фильтр по дате заказа (диапазон - от)

                  Дата без таймзоны приводится в UTC
              dateTo:
                type: string
                description: |-
                  Фильтр по дате заказа (диапазон - до)

                  Дата без таймзоны приводится в UTC
              count:
                type: integer
                description: Максимальное количество элементов в ответе
              offset:
                type: integer
                description: Смещение итератора элементов в ответе
              statuses:
                type: array
                description: |-
                  Фильтр по статусам отправления
                  Возможные значения:

                  - "NEW"
                  - "CONFIRMED"
                  - "PACKED"
                  - "PACKING_EXPIRED"
                  - "SHIPPED"
                  - "DELIVERED"
                  - "MERCHANT_CANCELED"
                  - "CUSTOMER_CANCELED"
                items:
                  type: string
              shipmentId:
                type: string
                description: Идентификатор отправления
              orderBy:
                type: object
                description: Параметры сортировки
                properties:
                  confirmationDate:
                    type: string
                    description: |-
                      Сортировка по дате подтверждения:

                      - asc
                      - desc
                  packingDate:
                    type: string
                    description: |-
                      Сортировка по дате комплектации:

                      - asc
                      - desc
                  shippingDate:
                    type: string
                    description: |-
                      Сортировка по дате отгрузки:

                      - asc
                      - desc
                  creationDate:
                    type: string
                    description: |-
                      Сортировка по дате создания:

                      - asc
                      - desc
              orderCode:
                type: string
                description: Номер заказа мерчанта
              customerOrderId:
                type: string
                description: Идентификатор заказа покупателя
              processSchemes:
                type: array
                description: Схемы заказа
                items:
                  type: object
                  properties:
                    scheme:
                      type: string
                      description: |-
                        Название схемы

                        - FBO
                        - FBS
                        - DBS
                        - CC
                    deliveryOperator:
                      type: string
                      description: |-
                        Оператор доставки:

                        - CDEK
                        - SBL
                  required:
                    - scheme
              deliveryId:
                type: string
                description: Идентификатор доставки
              serviceSchemes:
                type: array
                description: |-
                  Фильтр по сервисным схемам:

                  - DELIVERY_BY_GOODS
                  - DELIVERY_BY_MERCHANT
                  - COLLECT_BY_CUSTOMER
                items:
                  type: string
              fulfillmentMethod:
                type: array
                description: |-
                  Фильтр по методу фулфилмента:

                  - FULFILLMENT_BY_MERCHANT
                  - FULFILLMENT_BY_GOODS
                items:
                  type: string
              shippingDate:
                type: string
                description: |-
                  Фильтр по дате отгрузки

                  Поиск проводится в рамках одного дня
              shippingPointIds:
                type: array
                description: 'Фильтр по мерчантскому идентификатору локации '
                items:
                  type: string
              shippingPoints:
                type: array
                items:
                  type: string
              locationIds:
                type: array
                description: Фильтр по внутреннему идентификатору локации
                items:
                  type: integer
              isCancellationPending:
                type: boolean
                description: Фильтр по заказам у которых имеются лоты находящиеся в процессе отмены
            required:
              - token
        required:
          - data
    orderSearchResponse:
        type: object
        properties:
          success:
            type: integer
            description: Признак успешности запроса
          data:
            type: object
            description: Объект с полезными данными
            properties:
              shipments:
                type: array
                description: Массив найденных отправлений
                items:
                  type: string
