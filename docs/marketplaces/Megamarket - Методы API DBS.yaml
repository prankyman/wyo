openapi: 3.0.3
info:
  title: Методы API DBS
  version: '1.0'
servers:
  - url: 'https://api.megamarket.tech'
  - url: 'https://api-test.megamarket.tech'
paths:
  /api/market/v1/orderService/order/new:
    post:
      tags:
        - работа с заказом
      summary: Создание заказа
      operationId: post-api-market-v1-order-service-order-new
      description: |
        **Описание метода Order/New**

        URL метода: `/order/new` предоставляется Продавцом специалистам Мегамаркета.

        > <span style="color: #d41f1c;">**Важно!** </span>

        Запрос выполняется от Мегамаркета к Продавцу с информацией о новом заказе, оформленном на сайте Мегамаркета.

        В поле `quantity` всегда указывается единица. Количество лотов передается по факту количеством элементов `items`.

        Лот со стоимостью доставки указывается в отдельном `itemIndex`. Его не нужно включать в запросы на комплектацию, выдачу и отмену.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                meta:
                  type: object
                  description: Исходная информация от Продавца
                  properties:
                    source:
                      type: string
                      description: Источник данных
                data:
                  type: object
                  description: Общий блок с данными
                  required:
                    - merchantId
                    - shipments
                  properties:
                    merchantId:
                      type: integer
                      description: Идентификатор Продавца на стороне Мегамаркета
                    shipments:
                      type: array
                      description: Данные об отправлениях
                      items:
                        type: object
                        required:
                          - shipmentId
                          - shipmentDate
                          - items
                          - handover
                          - customer
                        properties:
                          shipmentId:
                            type: string
                            description: Идентификатор отправления Мегамаркета
                          shipmentDate:
                            type: string
                            format: date-time
                            description: Дата создания отправления
                          items:
                            type: array
                            description: Данные о лотах
                            items:
                              type: object
                              required:
                                - itemIndex
                                - goodsId
                                - offerId
                                - itemName
                                - price
                                - finalPrice
                                - quantity
                                - reservationPerformed
                                - isDigitalMarkRequired
                              properties:
                                itemIndex:
                                  type: string
                                  description: Порядковый номер лота
                                goodsId:
                                  type: string
                                  description: Идентификатор карточки товара Мегамаркета
                                offerId:
                                  type: string
                                  description: Идентификатор оффера продавца
                                itemName:
                                  type: string
                                  description: Наименование товара
                                price:
                                  type: integer
                                  description: Цена
                                finalPrice:
                                  type: integer
                                  description: Цена с учетом скидок
                                discounts:
                                  type: array
                                  description: Описание скидок
                                  items:
                                    type: object
                                    properties:
                                      discountType:
                                        type: string
                                        description: Тип скидки
                                      discountDescription:
                                        type: string
                                        description: Наименование скидки
                                      discountAmount:
                                        type: integer
                                        description: Сумма скидки
                                quantity:
                                  type: integer
                                  description: Количество
                                taxRate:
                                  type: integer
                                  nullable: true
                                  description: Налоговая ставка
                                reservationPerformed:
                                  type: boolean
                                  description: Внутренний параметр резервации товара в системе Мегамаркета
                                isDigitalMarkRequired:
                                  type: boolean
                                  description: Требуется ли цифровая маркировка
                          handover:
                            type: object
                            required:
                              - packingDate
                              - reserveExpirationDate
                              - outletId
                              - serviceScheme
                              - depositedAmount
                              - deliveryInterval
                              - deliveryId
                            properties:
                              packingDate:
                                type: string
                                format: date-time
                                description: 'Дата, к которой необходимо скомплектовать отправление'
                              reserveExpirationDate:
                                type: string
                                format: date-time
                                description: Дата истечения срока резерва в магазине
                              outletId:
                                type: string
                                description: Идентификатор магазина выдачи по системе продавца
                              serviceScheme:
                                type: string
                                description: Идентификатор схемы. Для ДСМ всегда = DELIVERY_BY_MERCHANT.
                              depositedAmount:
                                type: integer
                                description: 'Сумма, которую должен получить Мегамаркет по предоплате от покупателя (товар+доставка)'
                              deliveryInterval:
                                type: object
                                required:
                                  - dateFrom
                                  - dateTo
                                properties:
                                  id:
                                    type: string
                                    format: uuid
                                    description: ID интервала доставки (может быть пустым)
                                  dateFrom:
                                    type: string
                                    format: date-time
                                    description: Дата начала интервала доставки (начиная от какого времени будет доставлено)
                                  dateTo:
                                    type: string
                                    format: date-time
                                    description: Дата окончания интервала доставки (до какого времени будет доставлено)
                              deliveryId:
                                type: integer
                                description: Номер доставки Мегамаркета
                          customer:
                            type: object
                            required:
                              - customerFullName
                              - phone
                              - email
                            properties:
                              customerFullName:
                                type: string
                                description: ФИО Покупателя
                              phone:
                                type: string
                                description: Номер телефона покупателя в формате 7xxxxxxxxxx
                              email:
                                type: string
                                description: Email покупателя. Оставить пустым
                              address:
                                type: object
                                properties:
                                  source:
                                    type: string
                                    description: Источник
                                  postalCode:
                                    type: string
                                    description: Почтовый индекс
                                  fias:
                                    type: object
                                    properties:
                                      regionId:
                                        type: string
                                        description: Код региона
                                      destinationId:
                                        type: string
                                        description: Пункт назначения
                                  geo:
                                    type: object
                                    properties:
                                      lat:
                                        type: string
                                        description: Широта
                                      lon:
                                        type: string
                                        description: Долгота
                                  access:
                                    type: object
                                    properties:
                                      detachedHouse:
                                        type: boolean
                                        description: Дом
                                      entrance:
                                        type: string
                                        description: 'Вход, подъезд'
                                      floor:
                                        type: integer
                                        description: Этаж
                                      intercom:
                                        type: string
                                        description: Домофон
                                      cargoElevator:
                                        type: boolean
                                        description: Лифт
                                      comment:
                                        type: string
                                        description: Комментарий
                                      apartment:
                                        type: string
                                        description: Квартира
                                  regionKladrId:
                                    type: string
                                    description: Код региона
                                  house:
                                    type: string
                                    description: Номер дома
                                  block:
                                    type: string
                                    description: Номер строения
                                  flat:
                                    type: string
                                    description: Номер квартиры
                                  regionWithType:
                                    type: string
                                    description: Название региона
                                  cityWithType:
                                    type: string
                                    description: Название города
                                  cityArea:
                                    type: string
                                    description: Район города
                                  streetWithType:
                                    type: string
                                    description: Название улицы
                          flags:
                            type: string
                            description: Флаг
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: integer
                    description: Статус успеха
                  meta:
                    type: object
                    properties:
                      source:
                        type: string
                        description: Источник данных
        '400':
          description: Некорректное тело запроса
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: integer
                    example: 0
                  error:
                    type: object
                    properties:
                      errorText:
                        type: string
                        example: Unexpected end of JSON input
                      errorCode:
                        type: string
                        example: SyntaxError
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: integer
                    example: 0
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                        example: Internal Server Error
                      code:
                        type: integer
                        example: 500
  /api/market/v1/orderService/order/cancel:
    post:
      tags:
        - работа с заказом
      summary: Отмена заказа
      operationId: post-api-market-v1-order-service-order-cancel
      description: |

        URL метода: `order/cancel` предоставляет Продавец специалистам Мегамаркета.

        > <span style="color: #d41f1c;">**Важно!** </span>

        Запрос выполняется от Мегамаркета к Продавцу с информацией об отмене Лотов в Отправлении.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  description: Общий блок с данными
                  required:
                    - merchantId
                    - shipments
                  properties:
                    merchantId:
                      type: integer
                      description: Идентификатор Продавца на стороне Мегамаркета
                    shipments:
                      type: array
                      description: Данные об отправлениях
                      items:
                        type: object
                        required:
                          - shipmentId
                          - items
                        properties:
                          shipmentId:
                            type: string
                            description: Идентификатор отправления Мегамаркета
                          items:
                            type: array
                            description: Данные о лотах
                            items:
                              type: object
                              required:
                                - itemIndex
                                - goodsId
                                - offerId
                              properties:
                                itemIndex:
                                  type: integer
                                  description: Порядковый номер лота
                                goodsId:
                                  type: string
                                  description: Идентификатор артикула Мегамаркета
                                offerId:
                                  type: string
                                  description: Идентификатор оффера продавца
                meta:
                  type: object
                  description: Исходная информация от Продавца
                  properties:
                    source:
                      type: string
                      description: Источник данных
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: integer
                    description: Статус успеха
                  meta:
                    type: object
                    properties:
                      source:
                        type: string
                        description: Источник данных
        '400':
          description: Некорректное тело запроса
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: integer
                    example: 0
                  error:
                    type: object
                    properties:
                      errorText:
                        type: string
                        example: Unexpected end of JSON input
                      errorCode:
                        type: string
                        example: SyntaxError
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: integer
                    example: 0
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                        example: Internal Server Error
                      code:
                        type: integer
                        example: 500
  /api/market/v1/orderService/order/cancelResult:
    post:
      tags:
        - работа с заказом
      summary: Подтверждение отмены
      operationId: post-api-market-v1-order-service-order-cancel-result
      description: |
        **CancelResult**

        URL метода: `/order/cancelResult`

        Запрос выполняется Продавцом для подтверждения отмены на его стороне по истечению срока резерва.

        > <span style="color: #d41f1c;">**Важно!** </span>

        Перед началом работы во избежание фрода, связанного с отменами покупателями, необходимо обязательно реализовать метод `order/cancelResult` с двумя сценариями: подтверждение отмены (`canceled: TRUE`) и неподтверждение отмены (`canceled: FALSE`).

        После получения от Продавца подтверждения отмены у покупателя происходит отмена захолдированных средств.

        Если от продавца не получен ответ на `order/cancel` в течение 5 часов, происходит отмена захолдированных средств у покупателя.

        **Сценарии:**

        1. **Продавец скомплектовал товар и передал его в доставку:**
           - Клиент позвонил в КЦ и попросил отменить заказ, КЦ направил отмену.
           - Доставщику никто не передал информацию, он отдал заказ клиенту.
           - Продавец не подтверждает отмену, процедура отмены останавливается до дальнейших действий.

        2. **У заказа есть время на комплектацию, продавец забыл направить комплектацию вовремя (забыли, не сработала автоматика и т.д.), при этом заказ уже передали в доставку:**
           - Мегамаркет запускает отмену из-за истечения срока подтверждения.
           - Продавец не подтверждает отмену и направляет в Мегамаркет комплектацию.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  description: Общий блок с данными
                  required:
                    - token
                    - shipments
                  properties:
                    token:
                      type: string
                      description: Уникальный ключ для аутентификации продавца
                    shipments:
                      type: array
                      description: Данные об отправлениях
                      items:
                        type: object
                        required:
                          - shipmentId
                          - items
                        properties:
                          shipmentId:
                            type: string
                            description: Идентификатор отправления Мегамаркета
                          items:
                            type: array
                            description: Данные о лотах
                            items:
                              type: object
                              required:
                                - itemIndex
                                - canceled
                              properties:
                                itemIndex:
                                  type: integer
                                  description: Порядковый номер лота
                                canceled:
                                  type: boolean
                                  description: Информация о подтвержденной отмене
                meta:
                  type: object
                  description: Исходная информация от Продавца
                  properties:
                    source:
                      type: string
                      description: Источник данных
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: integer
                    description: Статус успеха
                  meta:
                    type: object
                    properties:
                      source:
                        type: string
                        description: Источник данных
                  data:
                    type: object
                    properties:
                      result:
                        type: integer
                        description: Результат подтверждения отмены (1 - успешный)
        '400':
          description: Некорректное тело запроса
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: integer
                    example: 0
                  error:
                    type: object
                    properties:
                      errorText:
                        type: string
                        example: Unexpected end of JSON input
                      errorCode:
                        type: string
                        example: SyntaxError
        '401':
          description: Некорректный токен
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: integer
                    example: 0
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                        example: No valid token.
                      code:
                        type: integer
                        example: 401
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: integer
                    example: 0
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                        example: Internal Server Error
                      code:
                        type: integer
                        example: 500
  /api/market/v1/orderService/order/packing:
    post:
      tags:
        - работа с заказом
      summary: Комплектация заказа
      operationId: post-api-market-v1-order-service-order-packing
      description: |
        **Описание метода `/order/packing`**

        Запрос выполняется Продавцом для информирования Мегамаркета о комплектации заказа на стороне Продавца.

        > <span style="color: #d41f1c;">**Важно!** </span>

        Продавец передает информацию о фактически скомплектованных лотах. Если лот не был скомплектован, он должен отсутствовать в запросе.<br>
        Метод `order/packing` может вызываться несколько раз, если комплектация происходит поэтапно. Каждый раз передается информация о тех лотах, которые были скомплектованы к настоящему моменту.<br>
        Значение порядкового номера лота (`itemIndex`) должно соответствовать значению, полученному в запросах `order/new` и `order/get`.<br>
        Идентификатор заказа Продавца (`orderCode`) может содержать только латиницу, цифры, и символы «_» и «-». Кириллица и другие специальные символы недопустимы.<br>
        В поле `quantity` всегда передается единица.<br>
        Не рекомендуется включать в метод лот доставки, переданный в `order/new`, в запросе его можно игнорировать.<br>

        **Дополнительная информация:**
        - Код маркировки по стандарту GS1 состоит из блоков: GTIN, серийный номер, а для некоторых товаров - дополнительные поля (МРЦ, срок годности). Для разделения блоков используется непечатный символ GS. Сканер при считывании маркировки должен работать в режим эмуляции COM-порта (Virtual COM Port), в противном случае передача разделителя GS будет некорректна, код маркировки не будет распознан системой. Подробнее про структуру маркировки можно почитать тут: https://markirovka.ru/knowledge/tovarnye-gruppy/radioelektronnaya-produktsiya-noutbuki-i-smartfony/sostav-koda-markirovki-radioelektronika?ysclid=mue86pgl3210377701
        - Наша система не является безотказной и иногда может быть недоступна. В таких случаях будет ответ с кодом ошибки "500". Рекомендуется предусмотреть функционал обработки ответов от маркетплейса и в случае необходимости автоматической повторной отправки запроса.
        - В сценариях Click & Collect метод `order/packing` используется для уведомления Мегамаркета о том, что заказ скомплектован и покупатель может его забрать. В случае с `DELIVERY_BY_MERCHANT`, этим методом необходимо уведомлять о готовности исполнить заказ.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  required:
                    - token
                    - shipments
                  properties:
                    token:
                      type: string
                      description: Уникальный ключ для аутентификации продавца
                    shipments:
                      type: array
                      description: Данные об отправлениях
                      items:
                        type: object
                        required:
                          - shipmentId
                          - orderCode
                          - items
                        properties:
                          shipmentId:
                            type: string
                            description: Идентификатор отправления Мегамаркета
                          orderCode:
                            type: string
                            description: Номер заказа по системе Продавца. Максимальная длина - 20 символов.
                          items:
                            type: array
                            description: Данные о лотах
                            items:
                              type: object
                              required:
                                - itemIndex
                                - quantity
                              properties:
                                itemIndex:
                                  type: string
                                  description: Порядковый номер лота
                                quantity:
                                  type: integer
                                  description: Количество
                                digitalMark:
                                  type: string
                                  description: 'Код маркировки (обязательно, если заказ предоплачен на сайте)'
                                requestIdTrueSign:
                                  type: string
                                  description: "id запроса в Честный знак"
                                requestTimestampTrueSign:
                                  type: integer
                                  description: "Время запроса в Честный знак"
                                localInstanceIdTrueSign:
                                  type: string
                                  description: "id локального устройства, на котором производится проверка Честного знака (передаётся только в случае оффлайн проверки)"
                                localDatabaseVersionTrueSign:
                                  type: string
                                  description: "Версия базы данных на локальном устройстве (передаётся только в случае оффлайн проверки)"
                      required:
                        - itemIndex      
                meta:
                  type: object
                  description: Исходная информация от Продавца
      responses:
        '200':
          description: Ответ успешной обработки запроса
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: integer
                    example: 1
                  meta:
                    type: object
                  data:
                    type: object
                    properties:
                      result:
                        type: integer
                        example: 1
        '400':
          description: Ответ некорректного тела запроса
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: integer
                    example: 0
                  error:
                    type: object
                    properties:
                      errorText:
                        type: string
                        example: Unexpected end of JSON input
                      errorCode:
                        type: string
                        example: SyntaxError
        '401':
          description: Ответ при некорректном токене
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: integer
                    example: 0
                  meta:
                    type: object
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                        example: No valid token.
                      code:
                        type: integer
                        example: 0
        '500':
          description: Серверная ошибка
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: integer
                    example: 0
                  error:
                    type: object
