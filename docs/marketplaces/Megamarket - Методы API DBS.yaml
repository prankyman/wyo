  /api/market/v1/orderService/order/close:
    post:
      tags:
        - работа с заказом
      summary: Закрытие заказа
      operationId: post-api-market-v1-order-service-order-close
      description: |
        Метод сообщает о выдаче или отказе от товара Покупателем.

        > <span style="color: #d41f1c;">**Важно!** </span>

        Система может быть недоступна, рекомендуется предусмотреть автоматическую повторную отправку запроса в случае ошибки с кодом "500".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  required:
                    - token
                    - shipments
                  properties:
                    token:
                      type: string
                      description: Уникальный ключ для аутентификации продавца
                    shipments:
                      type: array
                      items:
                        type: object
                        required:
                          - shipmentId
                          - closeDate
                          - items
                        properties:
                          shipmentId:
                            type: string
                            description: Идентификатор отправления Мегамаркета
                          closeDate:
                            type: string
                            format: date-time
                            description: |
                              Дата фактической выдачи заказа Покупателю.
                              Формат даты: `YYYY-MM-DDThh:mm:ss+hh:mm`
                          items:
                            type: array
                            items:
                              type: object
                              required:
                                - itemIndex
                                - handoverResult
                              properties:
                                itemIndex:
                                  type: integer
                                  description: Порядковый номер лота
                                handoverResult:
                                  type: boolean
                                  description: |
                                    Результат выдачи:
                                    - `true` — Получен покупателем
                                    - `false` — Не получен покупателем
                                reason:
                                  type: object
                                  properties:
                                    type:
                                      type: string
                                      description: |-
                                        Тип причины
                                        Возможные значения: 
                                        - **CANCEL_BY_CUSTOMER** - Получатель отказался от заказа
                                        - **HANDOVER_IMPOSSIBLE** - Заказ в ненадлежащем состоянии
                                    comment:
                                      type: string
                                      description: Отказ покупателя при выдаче
                meta:
                  type: object
                  description: Исходная информация от Продавца
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: integer
                    example: 1
                  meta:
                    type: object
                  data:
                    type: object
                    properties:
                      result:
                        type: integer
                        example: 1
        '400':
          description: Некорректное тело запроса
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: integer
                    example: 0
                  error:
                    type: object
                    properties:
                      errorText:
                        type: string
                        example: Unexpected end of JSON input
                      errorCode:
                        type: string
                        example: SyntaxError
        '401':
          description: Некорректный токен
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: integer
                    example: 0
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                        example: No valid token.
                      code:
                        type: integer
                        example: 401
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: integer
                    example: 0
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                        example: Internal Server Error
                      code:
                        type: integer
                        example: 500
  /api/market/v1/orderService/order/reject:
    post:
      tags:
        - работа с заказом
      summary: Отмена лотов по инициативе продавца
      operationId: post-api-market-v1-order-service-order-reject
      description: 'Продавец сообщает Мегамаркет об отмене лотов. Метод может быть вызван на любом этапе до выдачи заказа покупателю. Допустимо вызывать метод несколько раз, если необходимость отмены лотов возникает несколько раз в процессе исполнения заказа.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  required:
                    - token
                    - shipments
                  properties:
                    token:
                      type: string
                      description: Уникальный ключ для аутентификации продавца
                    shipments:
                      type: array
                      description: Данные об отправлениях
                      items:
                        type: object
                        required:
                          - shipmentId
                          - items
                        properties:
                          shipmentId:
                            type: string
                            description: Идентификатор отправления Мегамаркета
                          items:
                            type: array
                            description: Данные о лотах
                            items:
                              type: object
                              required:
                                - itemIndex
                                - offerId
                              properties:
                                itemIndex:
                                  type: string
                                  description: Порядковый номер лота
                                offerId:
                                  type: string
                                  description: Идентификатор оффера продавца
                    reason:
                      type: object
                      description: Причина отказа
                      properties:
                        type:
                          type: string
                          description: |-
                            Тип причины
                            Возможные значения: 
                            - **OUT_OF_STOCK** - Товара нет в наличии
                            - **NOT_ACCEPTABLE** - Ошибка в данных заказа (Подробности об ошибке передавать в поле Комментарий)
                          enum:
                            - OUT_OF_STOCK
                            - NOT_ACCEPTABLE
                        comment:
                          type: string
                          description: Комментарий с подробностями отказа
                meta:
                  type: object
                  description: Исходная информация от продавца
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: integer
                    description: Результат выполнения запроса
                    example: 1
                  meta:
                    type: object
                    description: Исходная информация от продавца
                  data:
                    type: object
                    properties:
                      result:
                        type: integer
                        description: Результат обработки данных
                        example: 1
        '500':
          description: Ошибка сервера
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Сообщение об ошибке
                    example: Internal Server Error
      x-sample-request:
        application/json:
          value:
            data:
              token: '********-****-****-****-************'
              shipments:
                - shipmentId: '863443571'
                  items:
                    - itemIndex: '1'
                      offerId: '5133560'
              reason:
                type: ''
            meta: {}
