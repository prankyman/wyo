openapi: 3.0.3
info:
  version: 1.0.0
  title: Методы API rDBS
servers:
  - url: 'https://api.megamarket.tech'
  - url: 'https://api-test.megamarket.tech'
paths:
  /api/market/v1/orderService/order/new:
    post:
      tags:
        - работа с заказом
      summary: Создание нового заказа
      description: |
        **Описание метода Order/New**

        URL метода: `/order/new` предоставляется Продавцом специалистам Мегамаркета.

        > <span style="color: #d41f1c;">**Важно!** </span>

        Запрос выполняется от Мегамаркета к Продавцу с информацией о новом заказе, оформленном на сайте Мегамаркета.

        В поле `quantity` всегда указывается единица. Количество лотов передается по факту количеством элементов `items`.

        Лот со стоимостью доставки указывается в отдельном `itemindex`. Его не нужно включать в запросы на комплектацию, выдачу и отмену.
      operationId: post-order-new
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/orderNewRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responseDefault'
      servers:
        - url: 'https://api.megamarket.tech'
        - url: 'https://api-test.megamarket.tech'
  /api/market/v1/orderService/order/cancel:
    post:
      tags:
        - работа с заказом
      summary: Отмена заказа
      description: |
        URL метода: `order/cancel` предоставляет Продавец специалистам Мегамаркета.

        > <span style="color: #d41f1c;">**Важно!** </span>

        Запрос выполняется от Мегамаркета к Продавцу с информацией об отмене Лотов в Отправлении.
      operationId: post-order-cancel
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/orderCancelRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responseDefault'
      servers:
        - url: 'https://api.megamarket.tech'
        - url: 'https://api-test.megamarket.tech'
  /api/market/v1/orderService/order/confirm:
    post:
      tags:
        - работа с заказом
      summary: Подтверждение заказа
      description: Продавец сообщает об изменении даты доставки. Метод может быть вызван для актуализации информации по заказу.
      operationId: post-order-confirm
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/orderConfirmRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responseDefault'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responseError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responseError'
      servers:
        - url: 'https://api.megamarket.tech'
        - url: 'https://api-test.megamarket.tech'
  /api/market/v1/orderService/order/packing:
    post:
      tags:
        - работа с заказом
      summary: Комплектация отправления
      description: |
        **Описание метода `/order/packing`**

        **URL метода:** `/order/packing`

        Запрос выполняется Продавцом для информирования Мегамаркета о комплектации заказа на стороне Продавца.
        Метод `order/packing` может вызываться несколько раз, если комплектация происходит поэтапно. Каждый раз передается информация о тех лотах, которые были скомплектованы к настоящему моменту.<br>
        Значение порядкового номера лота (`itemIndex`) должно соответствовать значению, полученному в запросах `order/new` и `order/get`.<br>
        Идентификатор заказа Продавца (`orderCode`) может содержать только латиницу, цифры, и символы «_» и «-». Кириллица и другие специальные символы недопустимы.<br>
        В поле `quantity` всегда передается единица.<br>
        Не рекомендуется включать в метод лот доставки, переданный в `order/new`, в запросе его можно игнорировать.<br>
        Запрос может быть сформирован двумя способами:

        - с генерацией штрихкода
        - без генерации штрихкода

        В первом случае Продавец генерирует штрихкод самостоятельно и передаёт в запросе в массиве boxes[].

        Во втором случае Продавец передаёт только порядковые номера коробок (1, 2, 3 и т.д.) в boxIndex в массиве items[].

        **Генерация штрихкода (boxCode)**
        
        boxCode представляет из себя последовательность символов, разделённых звёздочкой, вида "A\*B\*C", где

        - A - merchantId (id Продавца в системе ММ)
        - B - orderCode (номер заказа в системе Продавца)
        - C - boxIndex (порядковый номер коробки, начиная с 1)

        В контракте, где 

        - merchantId = 456
        - orderCode = CODE123
        - boxIndex = 1

        boxCode будет собран в 456\*CODE123\*1

        **Дополнительная информация:**
        - Код маркировки по стандарту GS1 состоит из блоков: GTIN, серийный номер, а для некоторых товаров - дополнительные поля (МРЦ, срок годности). Для разделения блоков используется непечатный символ GS. Сканер при считывании маркировки должен работать в режим эмуляции COM-порта (Virtual COM Port), в противном случае передача разделителя GS будет некорректна, код маркировки не будет распознан системой. Подробнее про структуру маркировки можно почитать тут: https://markirovka.ru/knowledge/tovarnye-gruppy/radioelektronnaya-produktsiya-noutbuki-i-smartfony/sostav-koda-markirovki-radioelektronika?ysclid=mue86pgl3210377701
        - Наша система не является безотказной и иногда может быть недоступна. В таких случаях будет ответ с кодом ошибки "500". Рекомендуется предусмотреть функционал обработки ответов от маркетплейса и в случае необходимости автоматической повторной отправки запроса.
        
      operationId: post-order-packing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/orderPackingRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responseDefault'
              examples:
                newDBS:
                  value:
                    data:
                      token: "string"
                      shipments:
                        - shipmentId: "string"
                          orderCode: "string"
                          items:
                            - itemIndex: 0
                              boxIndex: 0
                              digitalMark: "string"
                oldFBS:
                  value:
                    data:
                      token: "string"
                      shipments:
                        - shipmentId: "string"
                          orderCode: "string"
                          items:
                            - itemIndex: 0
                              digitalMark: "string"
                              boxes:
                                - boxIndex: 0
                                  boxCode: "string"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responseError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responseError'
      servers:
        - url: 'https://api.megamarket.tech'
        - url: 'https://api-test.megamarket.tech'
  /api/market/v1/orderService/order/reject:
    post:
      tags:
        - работа с заказом
      summary: Отмена лотов по инициативе продавца
      description: 'Продавец сообщает Мегамаркет об отмене лотов. Метод может быть вызван на любом этапе до выдачи заказа покупателю. Допустимо вызывать метод несколько раз, если необходимость отмены лотов возникает несколько раз в процессе исполнения заказа.'
      operationId: post-order-reject
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/orderRejectRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responseDefault'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responseError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responseError'
      servers:
        - url: 'https://api.megamarket.tech'
        - url: 'https://api-test.megamarket.tech'
  /api/merchantIntegration/rdbs/v1/sticker/print:
    post:
      tags:
        - работа с заказом
      summary: Печать этикеток
      operationId: post-sticker-print
      parameters:
        - name: X-Merchant-Token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/stickerPrintRequest'
      responses:
        '200':
          description: В случае успешного ответа возвращается сформированный файл.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/stickerPrintResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responseError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responseError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responseError'
      servers:
        - url: 'https://api.megamarket.tech'
        - url: 'https://api-test.megamarket.tech'
  /api/market/v1/orderService/order/search:
    post:
      tags:
        - работа с заказом
      summary: Получение отправлений по критериям
      operationId: post-order-search
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/orderSearchRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/orderSearchResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responseError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responseError'
      servers:
        - url: 'https://api.megamarket.tech'
        - url: 'https://api-test.megamarket.tech'
  /api/market/v2/orderService/order/get:
    post:
      tags:
        - работа с заказом
      summary: Получение детальной информации по отправлению
      operationId: post-order-get
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/orderGetRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/orderGetResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responseError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responseError'
      servers:
        - url: 'https://api.megamarket.tech'
        - url: 'https://api-test.megamarket.tech'
components:
  schemas:
    orderNewRequest:
      type: object
      properties:
        meta:
          type: object
          description: Объект с метаданными
        data:
          type: object
          description: Объект с полезными данными
          properties:
            merchantId:
              type: integer
              description: Идентификатор продавца в системе Мегамаркет
            shipments:
              type: array
              description: Массив отправлений
              items:
                type: object
                properties:
                  shipmentId:
                    type: string
                    description: Идентификатор отправления
                  shipmentDate:
                    type: string
                    description: 'Дата, к которой необходимо отгрузить отправление'
                    format: date-time
                  items:
                    type: array
                    description: Массив с лотами
                    items:
                      type: object
                      properties:
                        itemIndex:
                          type: string
                          description: Порядковый номер лота
                        goodsId:
                          type: string
                          description: Идентификатор товара в системе продавца
                        offerId:
                          type: string
                          description: Идентификатор товара в системе Мегамаркет
                        itemName:
                          type: string
                          description: Название товара
                        price:
                          type: integer
                          description: Стоимость без учёта скидок
                        finalPrice:
                          type: integer
                          description: Стоимость с учётом всех скидок
                        discounts:
                          type: array
                          description: Массив с информацией о скидках
                          items:
                            type: object
                            properties:
                              discountType:
                                type: string
                                description: Код примененной скидки
                              discountDescription:
                                type: string
                                description: Описание примененной скидки
                              discountAmount:
                                type: integer
                                description: Сумма скидки
                        quantity:
                          type: integer
                          description: Количество (всегда равно 1)
                        taxRate:
                          type: string
                          description: Ставка НДС
                        reservationPerformed:
                          type: boolean
                          description: Флаг "товар зарезервирован"
                        isDigitalMarkRequired:
                          type: boolean
                          description: Флаг "для товара потребуется указать КИЗ на комплектации"
                      required:
                        - itemIndex
                        - goodsId
                        - offerId
                        - itemName
                        - price
                        - finalPrice
                        - discounts
                        - quantity
                        - taxRate
                        - reservationPerformed
                        - isDigitalMarkRequired
                  handover:
                    type: object
                    description: Объект с данными о доставке
                    properties:
                      packingDate:
                        type: string
                        description: 'Дата, к которой товар должен быть скомплектован'
                        format: date-time
                      reserveExpirationDate:
                        type: string
                        description: 'Дата окончания резерва товара, после которой заказ будет отменён, если не будет скомплектован'
                        format: date-time
                      outletId:
                        type: string
                        description: Идентификатор склада продавца (в rDBS всегда 0)
                      serviceScheme:
                        type: string
                        description: Схема доставки
                      depositedAmount:
                        type: integer
                        description: 'Сумма, которая была захолдирована у клиента при создании заказа'
                      deliveryId:
                        type: integer
                        description: Идентификатор доставки
                      deliveryInterval:
                        type: object
                        description: Объект с данными об интервалах доставки
                        properties:
                          dateFrom:
                            type: string
                            description: 'Ожидаемое время доставки, от'
                            format: date-time
                          dateTo:
                            type: string
                            description: 'Ожидаемое время доставки, до'
                            format: date-time
                        required:
                          - dateFrom
                          - dateTo
                    required:
                      - packingDate
                      - reserveExpirationDate
                      - serviceScheme
                      - depositedAmount
                      - deliveryId
                      - deliveryInterval
                  customer:
                    type: object
                    description: Объект с информацией о клиенте
                    properties:
                      customerFullName:
                        type: string
                        description: Полное имя клиента
                      phone:
                        type: string
                        description: Телефон клиента
                      email:
                        type: string
                        description: Электронная почта клиента
                      address:
                        type: object
                        description: Объект с данными об адресе
                        properties:
                          source:
                            type: string
                            description: Полный адрес
                          postalCode:
                            type: string
                            description: Почтовый индекс
                          regionKladrId:
                            type: string
                            description: Код региона
                          house:
                            type: string
                            description: Дом
                          block:
                            nullable: true
                            description: Корпус
                          flat:
                            type: string
                            description: Квартира
                          regionWithType:
                            type: string
                            description: Регион
                          cityWithType:
                            type: string
                            description: Город
                          cityArea:
                            type: string
                            description: Район
                          streetWithType:
                            type: string
                            description: Улица
                          fias:
                            type: object
                            description: Объект с данными ФИАС
                            properties:
                              regionId:
                                type: string
                                description: Код региона
                              destinationId:
                                type: string
                                description: Код в системе ФИАС
                            required:
                              - regionId
                              - destinationId
                          geo:
                            type: object
                            description: Объект с данными геолокации
                            properties:
                              lat:
                                type: string
                                description: Широта
                              lon:
                                type: string
                                description: Долгота
                            required:
                              - lat
                              - lon
                          access:
                            type: object
                            description: Объект с дополнительными данными об адресе
                            properties:
                              entrance:
                                type: string
                                description: Подъезд
                              floor:
                                type: integer
                                description: Этаж
                              intercom:
                                type: string
                                description: Код домофона
                              apartment:
                                type: string
                                description: Квартира
                              comment:
                                nullable: true
                                description: Комментарий
                              detachedHouse:
                                type: boolean
                                description: Флаг "частный дом"
                              cargoElevator:
                                type: boolean
                                description: Флаг "наличие грузового лифта"
                        required:
                          - source
                          - postalCode
                          - regionKladrId
                          - house
                          - block
                          - flat
                          - regionWithType
                          - cityWithType
                          - cityArea
                          - streetWithType
                    required:
                      - phone
                      - address
                  flags:
                    type: array
                    items:
                      type: object
                required:
                  - shipmentId
                  - shipmentDate
                  - items
                  - handover
                  - customer
                  - flags
          required:
            - merchantId
            - shipments
      required:
        - data
    responseDefault:
      type: object
      properties:
        success:
          type: integer
          description: Признак успешности ответа
        error:
          type: object
          description: Описание ошибки (при наличии ошибок)
          properties:
            code:
              type: string
            message:
              type: string
      required:
        - success
    orderCancelRequest:
      type: object
      properties:
        data:
          type: object
          description: Объет с полезными данными
          properties:
            merchantId:
              type: integer
              description: Идентификатор продавца
            shipments:
              type: array
              description: Массив отправлений
              items:
                type: object
                properties:
                  shipmentId:
                    type: string
                    description: Идентификатор отправления
                  items:
                    type: array
                    description: Массив лотов
                    items:
                      type: object
                      properties:
                        itemIndex:
                          type: string
                          description: Порядковый номер лота
                        goodsId:
                          type: string
                          description: Идентификатор товара в системе ММ
                        offerId:
                          type: string
                          description: Идентификатор товара в системе продавца
                        cancellationType:
                          type: string
                          description: Тип отмены
                      required:
                        - itemIndex
                        - goodsId
                        - offerId
                required:
                  - shipmentId
                  - items
          required:
            - merchantId
            - shipments
      required:
        - data
    orderConfirmRequest:
      type: object
      properties:
        data:
          type: object
          description: Объект с полезными данными
          properties:
            token:
              type: string
              description: Токен продавца
            shipments:
              type: array
              description: Массив с отправлениями на подтверждение
              items:
                type: object
                properties:
                  shipmentId:
                    type: string
                    description: Уникальный идентификатор отправления
                  orderCode:
                    type: string
                    description: Уникальный идентификатор заказа в системе продавца
                  items:
                    type: array
                    description: Массив с лотами на подтверждение
                    items:
                      type: object
                      properties:
                        itemIndex:
                          type: string
                          description: Упрощенный идентификатор лота
                        offerId:
                          type: string
                          description: Идентификатор товара продавца
                        shippingDate:
                          type: string
                          description: Новая дата отгрузки
                      required:
                        - itemIndex
                required:
                  - shipmentId
                  - items
          required:
            - token
            - shipments
      required:
        - data
    responseError:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                description: Код ошибки
              message:
                type: string
                description: Причина ошибки
      required:
        - errors
    orderPackingRequest:
      type: object
      properties:
        data:
          type: object
          description: Объект с полезными данными
          properties:
            token:
              type: string
              description: Токен продавца
            shipments:
              type: array
              description: Массив отправлений
              items:
                type: object
                properties:
                  shipmentId:
                    type: string
                    description: Уникальный идентификатор отправления
                  orderCode:
                    type: string
                    description: Уникальный идентификатор заказа в системе продавца
                  items:
                    type: array
                    description: Массив с лотами на комплектацию
                    items:
                      type: object
                      properties:
                        itemIndex:
                          type: integer
                          description: Упрощенный идентификатор лота
                        boxIndex:
                          type: integer
                          description: 'Порядковый номер грузового места. Указывается, если штрихкод будет генерировать Мегамаркет'
                        digitalMark:
                          type: string
