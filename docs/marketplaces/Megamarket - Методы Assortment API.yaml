  /api/merchantIntegration/assortment/v1/card/save:
    post:
      tags:
        - карточки товара
      summary: Создание и обновление карточек товаров
      description: |
        Карточка товара — это сущность, содержащая набор характеристик товара, которые будут отображаться покупателям на витрине [Мегамаркета](https://megamarket.ru/).

        Метод используется для создания и обновления карточки товара с их текущими статусами по фильтру. Отфильтровать карточки можно по статусу, категории, дате создания, атрибуту "Артикул Мегамаркета" или атрибуту "Код товара продавца". Например, если вы хотите найти все карточки, по которым найдены ошибки, передайте параметр status равный `ERROR` или `CHANGES_REJECTED`

        ### Чтобы создать карточку товара:
        1. Получить дерево категорий
        2. Найти категорию `6-ого уровня`, подходящую к товару, которую вы хотите создать
        3. Сделать запрос Инфомодели с помощью идентификатора выбранной категории
        4. Сделать запрос на создание карточки, ориентируясь на полученные значения из Инфомодели
        5. Статус созданной карточки можно проверить с помощью [метода запроса информации о товаре по фильтру](/assortment/openapi#tag/kartochkige-tovara/operation/post-api-merchant-integration-assortment-v1-card-get).
        6. Если статус сменился на (`ERROR`) - воспользоваться [методом для получения детализации ошибок](/assortment/openapi#tag/kartochki-tovara/operation/post-api-merchantInternal-candidate-card-adaper-v1-card-getErrors). После этого следует снова загрузить обновленную версию карточки с исправлениями. Если товар перешел в статус (`ACTIVE`) - он готов к публикации. После добавления цен и остатков - покупатели смогут делать заказы с этим товаром.

        > <span style="color: #d41f1c;">**Важно!** </span>

        Неверно заполненная карточка будет создана, но не будет опубликована на витрине. Для создания карточки достаточно указать (`offerId`). Для публикации требуется заполнить обязательные атрибуты, имеющие значение `isRequired: true` непустыми значениями.

        ### Общие требования к элементам карточки товара
        #### Штрихкоды
        ##### Требования к значению:
        - Должен содержать только цифры
        - Одной карточке может быть присвоено до 8 ШК

        #### Фотографии
        ##### Технические требования к фотографиям:
        - Ссылка на фотографию не должна вести на облачное хранилище (Google.Диск, Яндекс.Диск, Dropbox)
        - Доступ к фотографии по ссылке не должен требовать авторизацию
        - Фотография должна храниться на ресурсе, имеющем сертификат безопасности
        - По ссылкам должны открываться и скачиваться только сами файлы
        - Формат: .jpg, .jpeg, .webp, .png
        - Размер: не более 20 Мб и не менее 0 байт
        - Разрешение: от 500х500px
        - В карточку можно добавить от 1 до 16 фотографий

        ##### Что нельзя размещать на фото:
        - Размытые и нечёткие фотографии.
        - Непрофессиональные фотографии, сделанные на складе или дома.
        - Водяные знаки, ссылки, рекламу магазина, номера телефонов, аккаунты соц.сетей  и мессенджеров
        - Указание цен, акций, скидок, пометок «Лучшее предложение», «выгодная покупка» и так далее.
        - Призывы к действию (например, купить или написать в мессенджеры).
        - Нежелательная символика или символика, которую можно трактовать двояко.
        - Пропаганда ЛГБТ и педофилии.
        - Контент, разжигающий ненависть.
        - Использовать скриншоты с отзывами с других площадок.
        - Использовать фотографии и прочий контент, который защищён авторскими правами. При необходимости вам может потребоваться подтвердить право на его использование.
        - Размещать в категориях Товаров для взрослых и Нижнем белье фото женской груди или гениталий. Их необходимо сделать размытыми.
        - Использовать заглушки вместо фотографии. Исключение: для товаров категории «Автозапчасти» допустимо использовать только нашу заглушку, если для них нет фото или оно низкого качества
        - Загружать вместо фото сертификаты или инструкции. Для этих документов в карточке товара есть отдельные поля. Их можно приложить в карточку на этапе её создания.

        #### Описание товара
        ##### Требования к описанию
        - Не содержит грамматических, стилистических и пунктуационных ошибок;
        - Не содержит нецензурную и ненормативную лексику;
        - Отражает соответствующую действительности информацию о товаре, без преувеличений и сравнения с конкурентными товарами;
        - Не содержит внешних ссылок;
        - Имеет структурированный вид;
        - Маркетинговое описание не должно содержать цену товара, призывы к покупке, информацию об акциях и распродажах, действующих в магазине продавца;
        - Не допускается использование больших букв и жирного текста;
        - Если вы хотите использовать форматирование текста, вам требуется создать обращение-;
        - Если в шаблоне категории нет характеристик, позволяющих отразить состав или комплектацию, следует указать эти данные в маркетинговом описании;
        - Длина не превышает 2500 символов.

        ##### Поддержка HTML разметки в описании товара
        Для более выразительного описания товара можно использовать HTML теги, они поддерживаются в визуальном редакторе при создании карточки через интерфейс, так и при создании карточки через Excel-файл.

        ##### Разрешенные HTML теги
        * Тег \<p\> (Параграф)
        * Тег \<br\> (Перенос текста на новую строку)
        * Тег \<ol\>\<li\>\</li\>\</ol\> (Нумерованный список)
        * \<ul\>\<li\>\</li\>\</ul\> (Маркированный список)
        * Тег \<strong\> (Полужирный)
        * Тег \<u\> (Подчеркнутый)

        #### Инструкция
        ##### Технические требования к инструкции:
        * Ссылка на фотографию не должна вести на облачное хранилище (Google.Диск, Яндекс.Диск, Dropbox)
        * Доступ к фотографии по ссылке не должен требовать авторизацию
        * Фотография должна храниться на ресурсе, имеющем сертификат безопасности
        * По ссылкам должны открываться и скачиваться только сами файлы
        * Формат: .jpg, .jpeg, .webp, .png, .pdf
        * Размер: не более 20 Мб и не менее 0 байт
        * Разрешение: от 500х500px, только если файл не .pdf

        #### Сертификат
        ##### Технические требования к сертификату:
        * Ссылка на фотографию не должна вести на облачное хранилище (Google.Диск, Яндекс.Диск, Dropbox)
        * Доступ к фотографии по ссылке не должен требовать авторизацию
        * Фотография должна храниться на ресурсе, имеющем сертификат безопасности
        * По ссылкам должны открываться и скачиваться только сами файлы
        * Формат: .jpg, .jpeg, .webp, .png, .pdf
        * Размер: не более 20 Мб и не менее 0 байт
        * Разрешение: от 500х500px, только если файл не .pdf

        #### Документ соответствия
        ##### Технические требования к документу соответствия:
        * Заполняется Код ОКПД2 - `"attributeId": 32941`
        * Товару не требуется сертификат или декларация соответствия - `"attributeId": 32937` (Заполняется `true`, если данный товар не нуждается в документе соответствия. Заполняется `false`, если документ нужен и обязательно заполняются даты и номер документа)
        * Номер декларации или сертификата соответствия - `"attributeId": 32938`
        * Дата начала действия документа соответствия - `"attributeId": 32939` (формат: "2025-10-23")
        * Дата окончания действия документа соответствия - `"attributeId": 32940` (формат: "2025-10-23")

        ### Чтобы обновить карточку товара:
        Для обновления данных требуется передать все ранее заполненные атрибуты.
        Повторно отправленные данные полностью заменят предыдущие.

        > <span style="color: #d41f1c;">**Важно!** </span>

        если при повторном запросе не передать ранее созданные атрибуты, то они будут удалены и заменены на `null`.


        ### В ответе будет следующая информация:
        - `successTotal` — количество успешно загруженных карточек
        - `errorTotal` — количество карточек, данные по которым не удалось загрузить из-за критичных ошибок
        - `successCards` — список успешно загруженных карточек
        - `errorCards` — список карточек с ошибками, данные по которым не удалось загрузить из-за критичных ошибок. С детализацией ошибок по каждой карточке
        - `changes` — описание изменений, которые произошли на этапе валидации (например: удалены лишние пробелы и неподдерживаемые символы, изменена категория)
