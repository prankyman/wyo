  /api/merchantIntegration/assortment/v1/infomodel/get:
    post:
      tags:
        - получение инфомодели
      summary: Запрос инфомодели
      description: |
        Инфомодель — набор атрибутов товара.

        > <span style="color: #d41f1c;">**Важно!** </span>

        Атрибуты делятся на два типа:
        - **Мастер атрибуты** — атрибуты, общие для всех категорий (пример: название товара, бренд)
        - **Контент атрибуты** — атрибуты, уникальные для выбранной категории (пример: количество скоростей (для категории Велосипеды), размер экрана (для категории Телефоны))

        Атрибуты, у которых значение `isRequired`: `true`, обязательны для заполнения при создании карточки товара.

        При работе с атрибутами, у которых `valueTypeCode` равен `enum` (имеют словарь значений), следует ориентироваться на значение `isSuggest`:
        - Если значение `true`, то можно как выбрать предложенное значение из словаря, так и предложить собственное.
        - Если значение `false`, то возможно только выбрать предложенное значение из словаря.

        При этом для всех атрибутов, кроме «Бренд», новое значение может содержать только следующие символы:
        - Цифры
        - Кириллица
        - Латиница
        - Буквы греческого алфавита α β Ω ω γ
        - Символы "", : ? ( ) - + / ! ' . ° % $ @ # № & < > ² ³ [ ] | \ * Ø ® ™

        Для атрибута «Бренд» разрешены только следующие символы:
        - Цифры
        - Кириллица
        - Латиница
        - Символы # № & - + : \  / . ' % ? !

        Для атрибутов, у которых `valueTypeCode` не равен `enum`, всегда указывается собственное значение.
      operationId: post-api-merchant-integration-assortmen-v1-infomodel-get
      requestBody:
        description: ""
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/infomodelGetRequest"
      responses:
