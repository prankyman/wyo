tags:
  - name: получение дерева категорий
    description: Получение дерева категорий
  - name: получение инфомодели
    description: Получение инфомодели
  - name: карточки товара
    description: Работа с карточками
  - name: цены
    description: Работа с ценами
  - name: остатки
    description: Работа со стоком
components:
  schemas:
    GetPricesByOfferIdRequest:
      type: object
      description: Запрос на получение цен
      properties:
        data:
          type: object
          properties:
            locationId:
              type: string
              description: Идентификатор склада
              example: Склад_01
            offerIds:
              type: array
              description: Массив идентификаторов товара мерчанта
              maxItems: 1000
              items:
                type: string
                example: SN100
          required:
            - locationId
            - offerIds
      required:
        - data
    GetPricesByGoodsIdRequest:
      type: object
      description: Запрос на получение цен по идентифкатору ММ
      properties:
        data:
          type: object
          properties:
            locationId:
              type: string
              description: Идентификатор склада
              example: Склад_01
            goodsIds:
              type: array
              description: Массив идентификаторов МегаМаркета
              maxItems: 1000
              items:
                type: integer
                example: 123749227
          required:
            - locationId
            - goodsIds
      required:
        - data
    GetPricesResponse:
      type: object
      description: Ответ на запрос получения цен
      properties:
        data:
          type: object
          properties:
            locationId:
              type: string
              description: Идентификатор склада
              example: Склад_01
            items:
              type: array
              items:
                $ref: "#/components/schemas/GetResponseItem"
          required:
            - locationId
            - items
      required:
        - data
    GetResponseItem:
      type: object
      description: Элемент списка цен
      properties:
        offerId:
          type: string
          description: Идентификатор оффера
          example: SN100
        goodsId:
          type: integer
          description: Идентификатор товара
          format: int64
          example: 600018246128
        price:
          type: integer
          description: Цена мерчанта
          format: int32
          example: 1000
        oldPrice:
          type: integer
          description: Старая цена
          format: int32
          example: 1500
        vat:
          type: string
          description: Размер НДС
          example: "20"
      required:
        - offerId
        - goodsId
        - price
    badRequest:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                description: Код ошибки
                example: badRequest
              message:
                type: string
                description: Текст ошибки
                example: Некорректный запрос. Проверьте параметры или формат запроса
            required:
              - code
              - message
    authorizedError:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                example: unauthorized
              message:
                type: string
                example: Ошибка авторизации
      required:
        - errors
    forbiddenError:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                description: Код ошибки
                example: forbidden
              message:
                type: string
                description: Причина ошибки
                example: Доступ запрещён
    requestTimeout:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                example: timeOut
              message:
                type: string
                example: Сервер прервал соединение из-за превышения времени ожидания запроса
      required:
        - errors
    defaultError:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                description: Код ошибки
                example: Запрос не может быть обработан из-за ошибок в содержимом. Проверьте данные на корректность
              message:
                type: string
                description: Текст ошибки
                example: unprocessableEntity
            required:
              - code
              - message
    tooManyRequests:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                description: Код ошибки
                example: tooManyRequests
              message:
                type: string
                description: Причина ошибки
                example: "Превышено допустимое количество запросов, попробуйте повторить запрос позже"
      required:
        - errors
    internalServerError:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                description: Код ошибки
                example: internalError
              message:
                type: string
                description: Причина ошибки
                example: "Сервис недоступен, попробуйте повторить запрос позже"
      required:
        - errors
    GetPricesByLocationRequest:
      type: object
      properties:
        data:
          type: object
          properties:
            locationId:
              type: string
              description: Идентификатор склада продавца
            lastId:
              type: integer
              description: "ID последнего полученного товара для пагинации.\r\nВ первом запросе не передается. В последующих передается значение, полученное в предыдущем запросе."
              format: int64
              example: 7478788774724
            limit:
              type: integer
              description: Количество значений в ответе
              format: int32
              minimum: 1
              maximum: 1000
              default: 100
              example: 100
          required:
            - locationId
    GetPricesByLocationResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            locationId:
              type: string
              description: Идентификатор склада продавца
            items:
              $ref: "#/components/schemas/GetResponseItem"
            lastId:
              type: integer
              description: "`ID` последнего полученного товара для пагинации.\r\nНеобходимо передать в последующем запросе для получения следующей группы товаров."
              format: int64
              example: 7478788774724
          required:
            - locationId
            - items
    categoryTreeResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/category"
      example:
        data:
          - level: 1
            id: 2463684633818876
            name: Мебель
            children:
              - level: 2
                id: 2463684633819005
                name: Мебель
                children:
                  - level: 4
                    id: 2463684633818905
                    name: Мягкая мебель
                    children:
                      - level: 5
                        id: 2463684633818885
                        name: Диваны и кушетки
                        children:
                          - level: 6
                            id: 2463684633818887
                            name: Диван
    category:
      type: object
      title: category
      properties:
        level:
          type: integer
          description: Уровень категории в иерархии
          example: 1
        id:
          type: integer
          description: Идентификатор категории
          example: 2463684633818876
        name:
          type: string
          description: Название категории
          example: Мебель
        children:
          type: array
          items:
            $ref: "#/components/schemas/category"
    categoryParentResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                description: Идентификатор категории
              name:
                type: string
                description: Название категории
    categoryBranchRequest:
      type: object
      properties:
        data:
          type: object
          properties:
            parentId:
              type: integer
              description: Идентификатор родительской категории
              example: 82
            skipIntermediateCategory:
              type: boolean
              description: "Флаг для пропуска промежуточных категорий. Если установлено значение true, то будут возвращены только категории 6-го уровня."
          required:
            - parentId
    categoryBranchResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/category"
      example:
        data:
          level: 1
          id: 2463684633818876
          name: Мебель
          children:
            - level: 2
              id: 2463684633819005
              name: Мебель
              children:
                - level: 4
                  id: 2463684633818905
                  name: Мягкая мебель
                  children:
                    - level: 5
                      id: 2463684633818885
                      name: Диваны и кушетки
                      children:
                        - level: 6
                          id: 2463684633818887
                          name: Диван
    infomodelGetRequest:
      type: object
      properties:
        data:
          type: object
          properties:
            categoryId:
              type: integer
              description: Идентификатор категории
          required:
            - categoryId
    infomodelGetResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            categoryId:
              type: integer
