    cardSaveRequest:
      type: object
      properties:
        categoryId:
          type: number
          description: Идентификатор категории
          example: 180203010101
        cards:
          type: array
          description: Массив товаров для создания и изменения
          maxItems: 100
          items:
            type: object
            properties:
              offerId:
                type: string
                description: Код товара продавца
                maxLength: 35
                example: SN100
              brand:
                type: string
                description: Бренд
                maxLength: 255
                example: Nike
              name:
                type: string
                description: Наименование карточки
                maxLength: 90
                example: Кроссовки Nike Air Force 1
              photos:
                type: array
                description: "Фотографии (в виде ссылок). Первая фотография в массиве будет фотографией по умолчанию. "
                maxItems: 15
                items:
                  type: string
                  maxLength: 3000
                  example: "https://some.site/photo01.jpg"
              barcodes:
                type: array
                description: Штрихкод
                items:
                  type: string
                  minLength: 8
                  maxLength: 13
                  example: "886691229063"
              manufacturerNo:
                type: string
                description: Артикул производителя
                maxLength: 50
                example: 315122-111
              description:
                type: string
                description: Описание
                maxLength: 2500
                example: Культовые кроссовки Nike AIR FORCE 1'07 высоты low с фирменной вышивкой на задниках и фирменной металлической шильдой на шнурках в честь первого выпуска.
              instruction:
                type: string
                description: Инструкция
                maxLength: 3000
                example: Носить на ногах.
              model:
                type: string
                description: Модель
                maxLength: 200
                example: Air Force 1
              series:
                type: string
                description: Серия
                maxLength: 200
                example: Air Force
              certificate:
                type: string
                description: Сертификат (в виде ссылки)
                maxLength: 3000
                example: "https://some.site/certificate.pdf"
              package:
                type: object
                description: Информация об упаковке
                properties:
                  length:
                    type: number
                    description: Длина
                    format: double
                    example: 20.5
                  width:
                    type: number
                    description: Ширина
                    format: double
                    example: 40.5
                  height:
                    type: number
                    description: Высота
                    format: double
                    example: 20.5
                  weight:
                    type: number
                    description: Вес
                    format: double
                    example: 500.5
              contentAttributes:
                type: array
                description: Массив контент атрибутов
                items:
                  type: object
                  properties:
                    attributeId:
                      type: number
                      description: Идентификатор контент атрибута
                      minimum: 1
                      example: 17922
                    values:
                      type: array
                      description: Значения атрибута
                      items:
                        type: string
                        example: белый
                  required:
                    - attributeId
            required:
              - offerId
      required:
        - categoryId
        - cards
