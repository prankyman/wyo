  /api/merchantIntegration/assortment/v1/categoryBranch/get:
    post:
      tags:
        - получение дерева категорий
      summary: Запрос всех вложенных категорий по заданной категории 1-го уровня
      description: |
        С помощью этого метода можно получить дерево категорий в усечённом виде — в виде одной ветки категории первого уровня.

        Для запроса необходимо указать категорию *первого уровня*, по которой нужно получить все вложенные категории.

        С помощью параметра `skipIntermediateCategory` можно убрать все уровни, кроме 6-го:
        - `true` — вернутся только категории 6-го уровня.
        - `false` — вернутся все категории с 1-го по 6-й уровень.

        По умолчанию `skipIntermediateCategory` равен `false`.
      operationId: post-api-merchant-integration-assortmen-v1-category-parent-get
      parameters:
        - name: X-Merchant-Token
          in: header
          required: true
          allowEmptyValue: false
          schema:
