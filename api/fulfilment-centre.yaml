webhooks:
    order.accepted:
        post:
            operationId: webhook_order_accepted
            summary: 'A working order exists: made at once or taken from the waiting list.'
            description:
                The notification is a signed `POST` with the headers `webhook-id`, `webhook-timestamp` and `webhook-signature`,
                as the Standard Webhooks specification describes. Any `2xx` answer means it was received; any other answer,
                a redirect, or no answer within 10 seconds means it was not, and it is sent again later (8 attempts over
                about 27 hours).
            parameters:
                - name: webhook-id
                  in: header
                  required: true
                  description: The event's id; the same on every attempt.
                  schema:
                      type: string
                - name: webhook-timestamp
                  in: header
                  required: true
                  description:
                      The moment of this attempt, in seconds since 1970-01-01 UTC. A receiver refuses one more than
                      five minutes away.
                  schema:
                      type: string
                - name: webhook-signature
                  in: header
                  required: true
                  description:
                      "`v1,` followed by the base64 of HMAC-SHA256 over the text `<webhook-id>.<webhook-timestamp>.<body>`,
                      keyed by the secret's bytes (the base64 text after `whsec_`)."
                  schema:
                      type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/Event'
            responses:
                2XX:
                    description: Received.
