components:
    securitySchemes:
        sellerKey:
            type: http
            scheme: bearer
            description: 'Every call carries `Authorization: Bearer <key>`. The key is an opaque secret text that names
                one seller. It is shown once, when it is created; the fulfilment centre keeps only a fingerprint and cannot
                show it again.'
    responses:
        BadRequest:
            description: The body or a parameter is wrong; `issues` names each place.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
        Unauthorized:
            description: There is no key, it is mistyped or it is revoked.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
        Forbidden:
            description:
                "Refused: the seller's work is switched off, the API is off, the key is read-only, or the marketplace
                is not enabled."
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
        NotFound:
            description: No such record for this seller.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
        Conflict:
            description: The call cannot be done in the record's present state.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
        TooLarge:
            description: The body is over its limit.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
        RateLimited:
            description: More than 300 requests a minute; wait `Retry-After` seconds.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
        Unavailable:
            description: The fulfilment centre is in maintenance.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
    schemas:
        Account:
            description: What the key may do.
            type: object
            properties:
                seller:
                    description: The seller this key belongs to.
                    x-go-type-name: AccountSeller
                    type: object
                    properties:
                        name:
                            description: The seller's name.
                            type: string
                    required:
                        - name
                api:
                    description: The state of the API for this seller.
                    x-go-type-name: AccountApi
                    type: object
                    properties:
                        enabled:
                            description: 'False when the seller switched the API off: every call is refused until it is
                                switched on.'
                            type: boolean
                    required:
                        - enabled
                key:
                    description: This key.
                    x-go-type-name: AccountKey
                    type: object
                    properties:
                        name:
                            description: The name given to the key when it was created.
                            type: string
                        access:
                            description: '`read_only` keys are refused on every write with `read_only_key`.'
                            type: string
                            enum:
                                - read_write
                                - read_only
                    required:
                        - name
                        - access
                marketplaces:
                    description: The marketplaces whose orders the seller sends through this API. An order names one of
                        these codes.
                    type: array
                    items:
                        x-go-type-name: AccountMarketplace
                        type: object
                        properties:
                            code:
                                description: The marketplace's code, as an order's `marketplace` takes it.
                                type: string
                            name:
                                description: The marketplace's name for a person to read.
                                type: string
                        required:
                            - code
                            - name
                limits:
                    description: The limits that apply to this key.
                    x-go-type-name: AccountLimits
                    type: object
                    properties:
                        requests_per_minute:
                            description: Requests a minute per key.
                            type: integer
                        body_bytes:
                            description: The largest JSON body.
                            type: integer
                        file_body_bytes:
                            description: The largest body of a call that carries a file.
                            type: integer
                        page_size:
                            description: The page size when `limit` is absent.
                            type: integer
                        max_page_size:
                            description: The largest `limit`.
                            type: integer
                        retention_days:
                            description: How long events, the journal and deliveries are kept.
                            type: integer
                    required:
                        - requests_per_minute
                        - body_bytes
                        - file_body_bytes
                        - page_size
                        - max_page_size
                        - retention_days
                server_time:
                    description: The fulfilment centre's clock, to compare with the caller's.
                    type: string
                    format: date-time
            required:
                - seller
                - api
                - key
                - marketplaces
                - limits
                - server_time
        Warehouse:
            description: A warehouse orders can be sent to.
            type: object
            properties:
                code:
                    description: What an order's `warehouse` takes.
                    type: string
                name:
                    description: The warehouse's name.
                    type: string
                city:
                    description: The city, when known.
                    type:
                        - string
                        - 'null'
            required:
                - code
                - name
                - city
        OrderIn:
            description: An order sent in. Unknown fields are refused, so no buyer data can travel in an order.
            type: object
            properties:
                external_id:
                    description: "The sender's own number of the order. Together with the marketplace it identifies the
                        order: sending it again is a repeat."
                    type: string
                    minLength: 1
                    maxLength: 64
                marketplace:
                    description: A code from `GET /account`; absent for an order of the seller's own shop.
                    type:
                        - string
                        - 'null'
                    minLength: 1
                    maxLength: 32
                group_id:
                    description: The buyer's basket, when several orders belong together.
                    type:
                        - string
                        - 'null'
                    minLength: 1
                    maxLength: 64
                warehouse:
                    description:
                        A code from `GET /warehouses`. May be left out when the fulfilment centre has one working
                        warehouse.
                    type:
                        - string
                        - 'null'
                    minLength: 1
                    maxLength: 16
                ship_by:
                    description: The deadline for handing the order to the carrier.
                    type: string
                    format: date-time
                packing_note:
                    description: A note for the packer.
                    type:
                        - string
                        - 'null'
                    maxLength: 300
                lines:
                    description: One to 200 lines. Two lines of one product are added up.
                    minItems: 1
                    maxItems: 200
                    type: array
                    items:
                        x-go-type-name: OrderInLine
                        type: object
                        properties:
                            article:
                                description: The product's article (its code at the seller).
                                type: string
                                minLength: 1
                                maxLength: 64
                            barcode:
                                description:
                                    The product's barcode, unique per seller. A box's or a pallet's barcode does
                                    not name a product.
                                type: string
                                minLength: 1
                                maxLength: 64
                            marketplace_item_id:
                                description: The marketplace's own id of the product.
                                type: string
                                minLength: 1
                                maxLength: 64
                            quantity:
                                description: How many units, a whole number from 1.
                                type: integer
                                minimum: 1
                                maximum: 1000000
                        required:
                            - quantity
                        additionalProperties: false
            required:
                - external_id
                - ship_by
                - lines
            additionalProperties: false
        OrderCancel:
            description: The reason for a cancel.
            type: object
            properties:
                reason:
                    description: Why the order is cancelled.
                    type: string
                    minLength: 1
                    maxLength: 300
            required:
                - reason
            additionalProperties: false
        OrderReduce:
            description: The wanted quantities of the lines to reduce.
            type: object
            properties:
                lines:
                    description: The lines to reduce.
                    minItems: 1
                    maxItems: 200
                    type: array
                    items:
                        x-go-type-name: OrderReduceLine
                        type: object
                        properties:
                            line:
                                description: The line's number in the order.
                                type: integer
                                minimum: 1
                            quantity:
                                description: How many units are wanted now; 0 removes the line.
                                type: integer
                                minimum: 0
                                maximum: 1000000
                        required:
                            - line
                            - quantity
                        additionalProperties: false
            required:
                - lines
            additionalProperties: false
        OrderPatch:
            description: The fields of an order that can still be changed.
            type: object
            properties:
                ship_by:
                    description: The new deadline.
                    type: string
                    format: date-time
                packing_note:
                    description: The new note; null clears it.
                    type:
                        - string
                        - 'null'
                    maxLength: 300
            additionalProperties: false
        ProblemIn:
            description: A problem the seller's system reports.
            type: object
            properties:
                code:
                    description: 'A short code the sender chooses: lower-case letters, digits and `_.-`.'
                    type: string
                    minLength: 1
                    maxLength: 64
                    pattern: ^[a-z0-9_.-]+$
                message:
                    description: What is wrong, in words for a person at the fulfilment centre.
                    type: string
                    minLength: 1
                    maxLength: 300
            required:
                - code
                - message
            additionalProperties: false
        Label:
            description: A label file for one parcel.
            type: object
            properties:
                content_type:
                    description: The file's type.
                    type: string
                    enum:
                        - application/pdf
                        - image/png
                        - image/jpeg
                data:
                    description: The file, base64-encoded; at most 5 MB.
                    type: string
                    minLength: 1
                    format: base64
                    contentEncoding: base64
                scan_code:
                    description: The text a scanner reads from the label.
                    type: string
                    minLength: 1
                    maxLength: 128
            required:
                - content_type
                - data
            additionalProperties: false
        HandoverDocuments:
            description: The documents of a hand-over.
            type: object
            properties:
                external_id:
                    description: The sender's own number of the hand-over (its supply on the marketplace).
                    type: string
                    minLength: 1
                    maxLength: 64
                documents:
                    description: One to 60 files.
                    minItems: 1
                    maxItems: 60
                    type: array
                    items:
                        x-go-type-name: HandoverDocumentIn
                        type: object
                        properties:
                            kind:
                                description:
                                    '`handover_code` is the code the receiver scans; `box_label` a label per transport
                                    box; `act` the act; `other` anything else.'
                                type: string
                                enum:
                                    - handover_code
                                    - box_label
                                    - act
                                    - other
                            title:
                                description: A title for a person to read.
                                type: string
                                minLength: 1
                                maxLength: 120
                            content_type:
                                description: The file's type.
                                type: string
                                enum:
                                    - application/pdf
                                    - image/png
                                    - image/jpeg
                            data:
                                description: The file, base64-encoded; at most 5 MB.
                                type: string
                                minLength: 1
                                format: base64
                                contentEncoding: base64
                            scan_code:
                                description: The text a scanner reads from the document.
                                type: string
                                minLength: 1
                                maxLength: 128
                        required:
                            - kind
                            - title
                            - content_type
                            - data
                        additionalProperties: false
            required:
                - external_id
                - documents
            additionalProperties: false
        Problem:
            description: A problem the seller's system reported, as the fulfilment centre keeps it.
            type: object
            properties:
                code:
                    description: The code the sender gave.
                    type: string
                message:
                    description: The message the sender gave.
                    type: string
                at:
                    description: When it was reported.
                    type: string
            required:
                - code
                - message
                - at
        Order:
            description: An order as the fulfilment centre holds it. It carries no buyer data.
            type: object
            properties:
                id:
                    description:
                        The order's id at the fulfilment centre; it stands in the address of every call about the
                        order.
