                                description: How many units are packed.
                                type: number
                                format: double
                            marking_required:
                                description: Whether each unit of the line carries a marking code that must be scanned.
                                    The product's card decides it, not the order; it lets the sender notice a disagreement
                                    with its marketplace.
                                type: boolean
                        required:
                            - line
