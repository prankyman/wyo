openapi: 3.1.0
info:
    title: Fulfilment centre API
    version: '1'
    description: |
        The API of a fulfilment centre: the system that stores a seller's goods, picks and packs the seller's orders and hands the
        parcels to a carrier. The seller's own system (an online shop, an accounting system, or a program that exchanges data with
        marketplaces using the seller's own marketplace keys) sends orders and labels in, and learns what the fulfilment centre did
        with every order. This file is the whole contract between the two sides; either side can be replaced by any program that keeps it.

        How a call is made

        - Every address starts with `/api/v1`; every request and answer body is JSON; every moment is ISO 8601 in UTC.
        - The key goes in the header `Authorization: Bearer <key>`. A key names exactly one seller, so no call carries a seller field.
        - Lists are read in pages: `limit` (50 by default, at most 200) and `cursor`, the value of `next_cursor` of the previous page.
        - A refusal is `{ "error": { "code", "params"?, "issues"? } }` with the status that goes with the code (see `Error`). `issues`
          lists `{ path, code }` pairs: where in the body the fault is and what it is. Values of the body never come back.
        - A record that belongs to another seller is answered exactly like one that does not exist (`404 not_found`).
        - Limits: 300 requests a minute per key (over it, `429 rate_limited` with `Retry-After`); a JSON body of at most 1 MB, and at most
          8 MB for the calls that carry files; events, journal and deliveries are kept 30 days.
        - Every write can be repeated safely: an order by its `external_id`, a label, a set of documents and a problem by `PUT`, a
          cancel and a cut by stating the wanted end state.

        What the fulfilment centre tells back

        Everything that happens to an order or a hand-over becomes an event with a growing `sequence`. A program reads the events with
        `GET /events`, or receives each one as a signed notification (the `webhooks` of this file, signed as the Standard Webhooks
        specification describes: https://github.com/standard-webhooks/standard-webhooks/blob/main/spec/standard-webhooks.md).
servers:
    - url: /api/v1
      description: Every address of this file is below /api/v1.
security:
    - sellerKey: []
tags:
    - name: account
      description: 'The seller and the warehouses: what this key may do and where orders can be sent.'
    - name: orders
      description: 'Orders: send an order in, read it, change it, cancel it, attach its label, report a problem.'
    - name: held
      description: 'Orders that wait: the fulfilment centre received the order but cannot turn it into a working order yet.'
    - name: events
      description: 'Events: everything that happened to orders and hand-overs, in order.'
    - name: handovers
      description: 'Hand-overs: the parcels that leave together, and the documents the receiving side needs.'
paths:
    /account:
        get:
            operationId: account
            tags:
                - account
            summary: Read what the key allows
            description:
                Returns the seller's name, whether the API is switched on for the seller, this key's access level,
                the marketplaces whose orders the seller sends, the limits that apply and the fulfilment centre's own clock.
            responses:
                '200':
                    description: Done.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Account'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '429':
                    $ref: '#/components/responses/RateLimited'
                '503':
                    $ref: '#/components/responses/Unavailable'
            x-error-codes:
                - unauthorized
                - forbidden
                - api_off
                - rate_limited
                - unavailable
    /warehouses:
        get:
            operationId: warehouses
            tags:
                - account
            summary: List the warehouses
            description:
                Returns the warehouses an order can be sent to. The `code` of a warehouse is what the `warehouse`
                field of an order takes.
            responses:
                '200':
                    description: Done.
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    warehouses:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/Warehouse'
                                required:
                                    - warehouses
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '429':
                    $ref: '#/components/responses/RateLimited'
                '503':
                    $ref: '#/components/responses/Unavailable'
            x-error-codes:
                - unauthorized
                - forbidden
                - api_off
                - rate_limited
                - unavailable
    /orders:
        post:
            operationId: orderCreate
            tags:
                - orders
            summary: Send an order
            description:
                "Hands one order to the fulfilment centre. The order is created inside the call. `201` with `state:
                accepted` means a working order exists. `202` with `state: held` means the order was received but waits
                (an unknown product, an unknown warehouse, the seller's work stopped); it is kept with its reasons, tried
                again later and never dropped. `200` with `duplicate: true` means this `external_id` was already taken in
                with the same lines: the same order is returned and no second one is made. The same `external_id` with other
                lines is `409 external_id_reused`. A line's product is found by `barcode` first, then by `article`, then
                by `marketplace_item_id`; an article and a barcode that point at two different products hold the order."
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/OrderIn'
            x-max-megabytes: 1
            responses:
                '200':
                    description: Done.
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    state:
                                        type: string
                                        const: accepted
                                    duplicate:
                                        type: boolean
                                        const: true
                                    order:
                                        $ref: '#/components/schemas/Order'
                                required:
                                    - state
                                    - duplicate
                                    - order
                '201':
                    description: Created.
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    state:
                                        type: string
                                        const: accepted
                                    order:
                                        $ref: '#/components/schemas/Order'
                                required:
                                    - state
                                    - order
                '202':
                    description: Received; `state` says what happens next.
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    state:
                                        type: string
                                        const: held
                                    held:
                                        $ref: '#/components/schemas/HeldOrder'
                                required:
                                    - state
                                    - held
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '409':
                    $ref: '#/components/responses/Conflict'
                '413':
                    $ref: '#/components/responses/TooLarge'
                '429':
                    $ref: '#/components/responses/RateLimited'
                '503':
                    $ref: '#/components/responses/Unavailable'
            x-error-codes:
                - read_only_key
                - bad_request
                - too_large
                - marketplace_not_enabled
                - external_id_reused
                - unauthorized
                - forbidden
                - api_off
                - rate_limited
                - unavailable
        get:
            operationId: orderList
            tags:
                - orders
            summary: List the orders
            description:
                Returns the seller's orders, however they reached the fulfilment centre, newest change first, in
                pages.
            parameters:
                - name: updated_since
                  in: query
                  required: false
                  schema:
                      type: string
                      format: date-time
                  description: Only orders changed at or after this moment.
                - name: status
                  in: query
                  required: false
                  schema:
                      type: string
                      enum:
                          - accepted
                          - waitingStock
                          - reserved
                          - picking
                          - packing
                          - packed
                          - shipped
                          - cancelled
                  description: Only orders in this stage.
                - name: marketplace
                  in: query
                  required: false
                  schema:
                      type: string
                  description: A marketplace code, or `none` for the seller's own shop.
                - name: external_id
                  in: query
                  required: false
                  schema:
                      type: string
                  description: Only the order with this sender's number.
                - name: limit
                  in: query
                  required: false
                  schema:
                      type: integer
                      minimum: 1
                      maximum: 200
                      default: 50
                  description: The page size.
                - name: cursor
                  in: query
                  required: false
                  schema:
                      type: string
                  description: The `next_cursor` of the previous page.
            responses:
                '200':
                    description: Done.
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    orders:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/Order'
                                    next_cursor:
                                        type:
                                            - string
                                            - 'null'
                                required:
                                    - orders
                                    - next_cursor
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '429':
                    $ref: '#/components/responses/RateLimited'
                '503':
                    $ref: '#/components/responses/Unavailable'
            x-error-codes:
                - bad_request
                - unauthorized
                - forbidden
                - api_off
                - rate_limited
                - unavailable
    /orders/{id}:
        get:
            operationId: orderGet
            tags:
                - orders
            summary: Read one order
            description: Returns one order as it is now.
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                      type: string
                  description: The record's id, as the object carries it.
            responses:
                '200':
                    description: Done.
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    order:
                                        $ref: '#/components/schemas/Order'
                                required:
                                    - order
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '429':
                    $ref: '#/components/responses/RateLimited'
                '503':
                    $ref: '#/components/responses/Unavailable'
            x-error-codes:
                - not_found
                - unauthorized
                - forbidden
                - api_off
                - rate_limited
                - unavailable
        patch:
            operationId: orderPatch
            tags:
                - orders
            summary: Change the deadline and the note
            description: Moves the hand-over deadline and/or replaces the packer's note. Only an order that came through
                this API can be changed (`409 not_api_order` otherwise); an order already handed over is `409 handed_over`.
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                      type: string
                  description: The record's id, as the object carries it.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/OrderPatch'
            x-max-megabytes: 1
            responses:
                '200':
                    description: Done.
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    state:
                                        type: string
                                        enum:
                                            - cancelled
                                            - reduced
                                            - updated
                                    order:
                                        $ref: '#/components/schemas/Order'
                                required:
                                    - state
                                    - order
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '409':
                    $ref: '#/components/responses/Conflict'
                '413':
                    $ref: '#/components/responses/TooLarge'
                '429':
                    $ref: '#/components/responses/RateLimited'
                '503':
                    $ref: '#/components/responses/Unavailable'
            x-error-codes:
                - read_only_key
                - bad_request
                - too_large
                - not_found
                - not_api_order
                - handed_over
                - conflict
                - unauthorized
                - forbidden
                - api_off
                - rate_limited
                - unavailable
    /orders/{id}/cancel:
        post:
            operationId: orderCancel
            tags:
                - orders
            summary: Cancel an order
            description: '`200 cancelled`: the order is cancelled and its goods are free again. `202 waiting`: a picker
                is walking the shelves with the order; the fulfilment centre repeats the cancel by itself. `202 needs_person`:
                a parcel is already closed and only a person at the fulfilment centre can cancel it. `409 handed_over`:
                too late. Cancelling a cancelled order succeeds.'
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                      type: string
                  description: The record's id, as the object carries it.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/OrderCancel'
            x-max-megabytes: 1
            responses:
                '200':
                    description: Done.
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    state:
                                        type: string
                                        enum:
                                            - cancelled
                                            - reduced
                                            - updated
                                    order:
                                        $ref: '#/components/schemas/Order'
                                required:
                                    - state
                                    - order
                '202':
                    description: Received; `state` says what happens next.
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    state:
                                        type: string
                                        enum:
                                            - waiting
                                            - needs_person
                                    order:
                                        $ref: '#/components/schemas/Order'
                                required:
                                    - state
                                    - order
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '409':
                    $ref: '#/components/responses/Conflict'
                '413':
                    $ref: '#/components/responses/TooLarge'
                '429':
                    $ref: '#/components/responses/RateLimited'
                '503':
                    $ref: '#/components/responses/Unavailable'
            x-error-codes:
                - read_only_key
                - bad_request
                - too_large
                - not_found
                - not_api_order
                - handed_over
                - conflict
                - unauthorized
                - forbidden
                - api_off
                - rate_limited
                - unavailable
    /orders/{id}/reduce:
        post:
            operationId: orderReduce
            tags:
                - orders
            summary: Reduce an order
            description: 'States, for each named line, how many units are wanted now (0 removes the line). Answers like
                a cancel: `200 reduced`, `202 waiting`, `202 needs_person`, `409 handed_over`. A number above the current
                one is `400` with the issue code `above_current`; an unknown line is `400` with `unknown_line`. When every
                line is brought to zero the call is a cancel of the order.'
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                      type: string
                  description: The record's id, as the object carries it.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/OrderReduce'
            x-max-megabytes: 1
            responses:
                '200':
                    description: Done.
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    state:
                                        type: string
                                        enum:
                                            - cancelled
                                            - reduced
                                            - updated
                                    order:
                                        $ref: '#/components/schemas/Order'
                                required:
                                    - state
                                    - order
                '202':
                    description: Received; `state` says what happens next.
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    state:
                                        type: string
                                        enum:
                                            - waiting
                                            - needs_person
                                    order:
                                        $ref: '#/components/schemas/Order'
                                required:
                                    - state
                                    - order
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '409':
                    $ref: '#/components/responses/Conflict'
                '413':
                    $ref: '#/components/responses/TooLarge'
                '429':
                    $ref: '#/components/responses/RateLimited'
                '503':
                    $ref: '#/components/responses/Unavailable'
            x-error-codes:
                - read_only_key
                - bad_request
                - too_large
                - not_found
                - not_api_order
                - handed_over
                - conflict
                - unauthorized
                - forbidden
                - api_off
                - rate_limited
                - unavailable
    /orders/{id}/problem:
        put:
            operationId: orderProblemSet
            tags:
                - orders
            summary: Report a problem with an order
            description:
                Tells the fulfilment centre that something is wrong with this order on the seller's side (for example
                a marketplace refused a marking code). An order has one problem; sending another replaces it. It is allowed
                at any stage, even after the hand-over, and only the sender clears it.
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                      type: string
                  description: The record's id, as the object carries it.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ProblemIn'
            x-max-megabytes: 1
            responses:
                '200':
                    description: Done.
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    state:
                                        type: string
                                        enum:
                                            - cancelled
                                            - reduced
                                            - updated
                                    order:
                                        $ref: '#/components/schemas/Order'
                                required:
                                    - state
                                    - order
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '409':
                    $ref: '#/components/responses/Conflict'
                '413':
                    $ref: '#/components/responses/TooLarge'
                '429':
                    $ref: '#/components/responses/RateLimited'
                '503':
                    $ref: '#/components/responses/Unavailable'
            x-error-codes:
                - read_only_key
                - bad_request
                - too_large
                - not_found
                - not_api_order
                - unauthorized
                - forbidden
                - api_off
                - rate_limited
                - unavailable
        delete:
            operationId: orderProblemClear
            tags:
                - orders
            summary: Clear an order's problem
            description: Removes the problem the seller's system reported.
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                      type: string
                  description: The record's id, as the object carries it.
            responses:
                '200':
                    description: Done.
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    state:
                                        type: string
                                        enum:
                                            - cancelled
                                            - reduced
                                            - updated
                                    order:
                                        $ref: '#/components/schemas/Order'
                                required:
                                    - state
                                    - order
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '409':
                    $ref: '#/components/responses/Conflict'
                '429':
                    $ref: '#/components/responses/RateLimited'
                '503':
                    $ref: '#/components/responses/Unavailable'
            x-error-codes:
                - read_only_key
                - not_found
                - not_api_order
                - unauthorized
                - forbidden
                - api_off
                - rate_limited
                - unavailable
    /orders/{id}/parcels/{number}/label:
        put:
            operationId: labelPut
            tags:
                - orders
            summary: Attach a label to a parcel
            description: 'A marketplace issues its label after packing, so an order is created without one and the label
                follows. The file is checked by its bytes: an empty file, a file over 5 MB or one of another type is `400`
                with the issue path `data`. `scan_code` is the text a scanner reads from the label, when known: the parcel
                can then be closed only by scanning exactly that code (a code taken by another parcel is `409 conflict`).
                Without it any scan is accepted. A label cannot be sent once the order is handed over (`409 handed_over`)
                or cancelled (`409 conflict`).'
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                      type: string
                  description: The record's id, as the object carries it.
                - name: number
                  in: path
                  required: true
                  schema:
                      type: integer
                      minimum: 1
                  description: The parcel's number in the order, from 1.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/Label'
            x-max-megabytes: 8
            responses:
                '200':
                    description: Done.
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    state:
                                        type: string
                                        enum:
                                            - cancelled
                                            - reduced
                                            - updated
                                    order:
                                        $ref: '#/components/schemas/Order'
                                required:
                                    - state
                                    - order
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '409':
                    $ref: '#/components/responses/Conflict'
                '413':
                    $ref: '#/components/responses/TooLarge'
                '429':
                    $ref: '#/components/responses/RateLimited'
                '503':
                    $ref: '#/components/responses/Unavailable'
            x-error-codes:
                - read_only_key
                - bad_request
                - too_large
                - not_found
                - not_api_order
                - handed_over
                - conflict
                - unauthorized
                - forbidden
                - api_off
                - rate_limited
                - unavailable
        delete:
            operationId: labelDelete
            tags:
                - orders
            summary: Remove a parcel's label
            description: Removes the label while the parcel is still open.
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                      type: string
                  description: The record's id, as the object carries it.
                - name: number
                  in: path
                  required: true
                  schema:
                      type: integer
                      minimum: 1
                  description: The parcel's number in the order, from 1.
            responses:
                '200':
                    description: Done.
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    state:
                                        type: string
                                        enum:
                                            - cancelled
                                            - reduced
                                            - updated
                                    order:
                                        $ref: '#/components/schemas/Order'
                                required:
                                    - state
                                    - order
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '409':
                    $ref: '#/components/responses/Conflict'
                '429':
                    $ref: '#/components/responses/RateLimited'
                '503':
                    $ref: '#/components/responses/Unavailable'
            x-error-codes:
                - read_only_key
                - not_found
                - not_api_order
                - handed_over
                - conflict
                - unauthorized
                - forbidden
                - api_off
                - rate_limited
                - unavailable
    /held-orders:
        get:
            operationId: heldList
            tags:
                - held
            summary: List the orders that wait
            description: Returns every received order that has not been turned into a working order, with its reasons.
            responses:
                '200':
                    description: Done.
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    held_orders:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/HeldOrder'
                                required:
                                    - held_orders
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '429':
                    $ref: '#/components/responses/RateLimited'
                '503':
                    $ref: '#/components/responses/Unavailable'
            x-error-codes:
                - unauthorized
                - forbidden
                - api_off
                - rate_limited
                - unavailable
    /held-orders/{id}:
        get:
            operationId: heldGet
            tags:
                - held
            summary: Read a received order
            description: Returns the record of a received order in any of its states.
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                      type: string
                  description: The record's id, as the object carries it.
            responses:
                '200':
                    description: Done.
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
