    /handovers/{id}/documents:
        put:
            operationId: handoverDocuments
            tags:
                - handovers
            summary: Send the hand-over's documents
            description:
                A marketplace gives the documents of a hand-over (the code the receiver scans, a label per transport
                box, an act) only after its own supply is closed, and a closed supply takes no more orders. So the fulfilment
                centre asks for them when the parcels are ready (the event `handover.requested`) and the seller's system
                answers with this call. A repeat replaces the earlier set. `409 conflict` when the documents were not asked
                for, or the hand-over is completed.
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                      type: string
                  description: The record's id, as the object carries it.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/HandoverDocuments'
            x-max-megabytes: 8
            responses:
                '200':
                    description: Done.
                    content:
