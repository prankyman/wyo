                                                `\u001d`), exactly as scanned.
                                            type: string
                                    required:
                                        - line
                                        - marking_code
                        required:
                            - number
                            - closed_at
                            - handed_over_at
                            - label_attached
                            - units
                problem:
                    description: The problem the sender reported; null when there is none.
                    oneOf:
                        - $ref: '#/components/schemas/Problem'
                        - description: The problem the sender reported; null when there is none.
                          type: 'null'
                handover_id:
                    description: The hand-over the parcels leave in; null until the first parcel is closed.
                    type:
                        - string
                        - 'null'
                sequence:
                    description: The number of the order's latest event; it tells which of two states of the order is newer.
                    type:
                        - integer
                        - 'null'
                updated_at:
                    description: When the order last changed.
                    type: string
                    format: date-time
            required:
                - id
                - number
                - external_id
                - group_id
                - marketplace
                - via
                - warehouse
                - status
                - warehouse_status
                - ship_by
                - packing_note
                - lines
                - parcels
                - problem
                - handover_id
                - sequence
                - updated_at
        HeldOrder:
            description: 'The record of a received order: waiting, taken in or withdrawn.'
            type: object
            properties:
                id:
                    description: The record's id.
                    type: string
                external_id:
                    description: The sender's own number of the order.
                    type: string
                marketplace:
                    description: The marketplace's code; null for the seller's own shop.
                    type:
                        - string
                        - 'null'
                state:
                    description:
                        "`held_link` a product is unknown, or an article and a barcode point at two products; `held_warehouse`
                        the warehouse is unknown or not named; `held_work` the seller's work is stopped; `held_refused`
                        the order service refused it; `accepted` a working order exists; `withdrawn` taken off the list."
                    type: string
                    enum:
                        - held_link
                        - held_warehouse
                        - held_work
                        - held_refused
                        - accepted
                        - withdrawn
                reasons:
                    description:
                        Why the order waits. Each reason is a code with the names it concerns (which article, which
                        warehouse).
                    type: array
                    items:
                        x-go-type-name: HeldReason
                        type: object
                        properties:
                            code:
                                description: The reason's code.
                                type: string
                            params:
                                description: What the reason names; each value is a text or a number.
                                type: object
                                propertyNames:
                                    type: string
                                additionalProperties: true
                        required:
                            - code
                received_at:
                    description: When the order was received.
                    type: string
                    format: date-time
                order_id:
                    description: The working order, once there is one.
                    type:
                        - string
                        - 'null'
            required:
                - id
                - external_id
                - marketplace
                - state
                - reasons
                - received_at
                - order_id
        Handover:
            description: The parcels of one seller, one warehouse and one marketplace that leave together on one day.
            type: object
            properties:
                id:
                    description: The hand-over's id.
                    type: string
                number:
                    description: The number the people at the fulfilment centre see.
                    type: integer
                warehouse:
                    description: The warehouse's code.
                    type: string
                marketplace:
                    description: The marketplace's code; null for the seller's own shop.
                    type:
                        - string
                        - 'null'
                planned_date:
                    description: The day the parcels leave.
                    type: string
                    format: date
                state:
                    description:
                        '`open` not yet left; `documents_requested` the fulfilment centre waits for the documents
                        (no more parcels join); `documents_ready` they arrived; `completed` every parcel left.'
                    type: string
                    enum:
                        - open
                        - documents_requested
                        - documents_ready
                        - completed
                transport_boxes:
                    description: How many transport boxes there are, when the fulfilment centre said.
                    type:
                        - integer
                        - 'null'
                external_id:
                    description: The sender's own number, once the documents were sent.
                    type:
                        - string
                        - 'null'
                parcels:
                    description: The parcels in the hand-over.
                    type: array
                    items:
                        x-go-type-name: HandoverParcel
                        type: object
                        properties:
                            order_id:
                                description: The order's id.
                                type: string
                            external_id:
                                description: The order's number at the sender.
                                type: string
                            number:
                                description: The parcel's number in the order.
                                type: integer
                            scan_code:
                                description: The label's scan text, when known.
                                type:
                                    - string
                                    - 'null'
                        required:
                            - order_id
                            - external_id
                            - number
                            - scan_code
                documents:
                    description: The documents that arrived, without their files.
                    type: array
                    items:
                        x-go-type-name: HandoverDocument
                        type: object
                        properties:
                            kind:
                                description: The document's kind.
                                type: string
                                enum:
                                    - handover_code
                                    - box_label
                                    - act
                                    - other
                            title:
                                description: The document's title.
                                type: string
                        required:
                            - kind
                            - title
                problem:
                    description: The problem the sender reported; null when there is none.
                    oneOf:
                        - $ref: '#/components/schemas/Problem'
                        - description: The problem the sender reported; null when there is none.
                          type: 'null'
            required:
                - id
                - number
                - warehouse
                - marketplace
                - planned_date
                - state
                - transport_boxes
                - external_id
                - parcels
                - documents
                - problem
        Event:
            description:
                One fact about an order or a hand-over. `data` holds the object as it is at the moment the event
                is read or sent, and `details` the event's small facts. A receiver discards an event whose `sequence` is
                lower than one it already applied.
            type: object
            properties:
                id:
                    description: The event's id; the same on every attempt to deliver it.
                    type: string
                type:
                    description: The event's type, for example `order.packed`.
                    type: string
                occurred_at:
                    description: When it happened.
                    type: string
                    format: date-time
                sequence:
                    description: A growing number; a reader keeps the last one it applied.
                    type: integer
                data:
                    description: What the event is about, as it is now.
                    x-go-type-name: EventData
                    type: object
                    properties:
                        order:
                            description: The order, for an `order.*` event.
                            $ref: '#/components/schemas/Order'
                        held:
                            description: The waiting order's record, for `order.held`.
                            $ref: '#/components/schemas/HeldOrder'
                        handover:
                            description: The hand-over, for a `handover.*` event.
                            $ref: '#/components/schemas/Handover'
                        details:
                            description: "The event's small facts: the parcel's number, who cancelled, why a change waits."
                            type: object
                            propertyNames:
                                type: string
                            additionalProperties: {}
            required:
                - id
                - type
                - occurred_at
                - sequence
                - data
        Error:
            description: A refusal.
            type: object
            properties:
                error:
                    description: The refusal.
                    x-go-type-name: ErrorBody
                    type: object
                    properties:
                        code:
                            description:
                                "What went wrong. `bad_request` (400): The body or a parameter is wrong; `issues`
                                names each place. `unauthorized` (401): No key, a mistyped key, or a revoked key. `forbidden`
                                (403): The seller's work is switched off at the fulfilment centre. `api_off` (403): The
                                seller switched the API off; a right key does not work until it is switched on. `read_only_key`
                                (403): A write with a read-only key. `marketplace_not_enabled` (403): The order's marketplace
                                is not enabled for this seller. `not_found` (404): No such record for this seller (another
                                seller's record answers the same). `not_api_order` (409): Only an order that came through
                                this API can be changed. `external_id_reused` (409): A repeat of an order number with other
                                lines. `handed_over` (409): The order is already handed over; too late. `conflict` (409):
                                The call cannot be done now: the order is cancelled, the documents were not asked for, the
                                hand-over is completed, the scan code is taken by another parcel. `too_large` (413): The
                                body is over its limit. `rate_limited` (429): More than 300 requests a minute. `unavailable`
                                (503): The fulfilment centre is in maintenance."
                            type: string
                            enum:
                                - bad_request
                                - unauthorized
                                - forbidden
                                - api_off
                                - read_only_key
                                - marketplace_not_enabled
                                - not_found
                                - not_api_order
                                - external_id_reused
                                - handed_over
                                - conflict
                                - too_large
                                - rate_limited
                                - unavailable
                        params:
                            description: What the code names; each value is a text or a number.
                            type: object
                            propertyNames:
                                type: string
                            additionalProperties: true
                        issues:
                            description: Where in the body the fault is.
                            type: array
                            items:
                                x-go-type-name: ErrorIssue
                                type: object
                                properties:
                                    path:
                                        description: The place in the body.
                                        type: string
                                    code:
                                        description: What is wrong there.
                                        type: string
                                required:
                                    - path
                                    - code
                    required:
                        - code
            required:
                - error
x-limits:
    requests_per_minute: 300
    body_megabytes: 1
    file_body_megabytes: 8
    page_size: 50
    max_page_size: 200
    retention_days: 30
    notification_attempts: 8
x-errors:
    - code: bad_request
      status: 400
      description: The body or a parameter is wrong; `issues` names each place.
    - code: unauthorized
      status: 401
      description: No key, a mistyped key, or a revoked key.
    - code: forbidden
      status: 403
      description: The seller's work is switched off at the fulfilment centre.
    - code: api_off
      status: 403
      description: The seller switched the API off; a right key does not work until it is switched on.
    - code: read_only_key
      status: 403
      description: A write with a read-only key.
    - code: marketplace_not_enabled
      status: 403
      description: The order's marketplace is not enabled for this seller.
    - code: not_found
      status: 404
      description: No such record for this seller (another seller's record answers the same).
    - code: not_api_order
      status: 409
      description: Only an order that came through this API can be changed.
    - code: external_id_reused
      status: 409
      description: A repeat of an order number with other lines.
    - code: handed_over
      status: 409
      description: The order is already handed over; too late.
    - code: conflict
      status: 409
      description:
          'The call cannot be done now: the order is cancelled, the documents were not asked for, the hand-over is
          completed, the scan code is taken by another parcel.'
    - code: too_large
      status: 413
      description: The body is over its limit.
    - code: rate_limited
      status: 429
      description: More than 300 requests a minute.
    - code: unavailable
      status: 503
      description: The fulfilment centre is in maintenance.
