                                description: When the parcel was closed; null while it is open.
                                type:
                                    - string
                                    - 'null'
                                format: date-time
                            handed_over_at:
                                description: When the parcel left with the carrier.
                                type:
                                    - string
                                    - 'null'
                                format: date-time
                            label_attached:
                                description: Whether a label is attached.
                                type: boolean
                            units:
                                description: The packed units with their marking codes. Filled once packing is finished,
                                    empty again when packing is restarted.
                                type: array
                                items:
                                    x-go-type-name: OrderParcelUnit
