            summary: Read the events
            description:
                Returns the events after the number `after` (from the start when absent), oldest first. `next_after`
                is the last number of the page when more events wait behind it, otherwise `null`. A reader keeps the last
                number it applied and asks again from there. `types` is a comma-separated list of event types.
            parameters:
                - name: after
                  in: query
                  required: false
                  schema:
                      type: integer
                      minimum: 0
                      default: 0
                  description: Return events after this number.
                - name: types
                  in: query
                  required: false
                  schema:
                      type: string
                  description: A comma-separated list of event types.
                - name: limit
                  in: query
                  required: false
                  schema:
                      type: integer
                      minimum: 1
                      maximum: 200
                      default: 50
                  description: The page size.
