openapi: 3.1.0
info:
    title: wyo server API
    version: 0.0.1
    description: >-
        The API the wyo interface calls. Every answer is data or a code with parameters; the wyo server never writes a
        sentence for a person (the texts live in the interface's `messages/`).
servers:
    - url: /
paths:
    /api/v1/meta:
        get:
            operationId: getMeta
            summary: The program's name, version and mode.
            responses:
                '200':
                    description: The program's name, version and mode.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Meta'
                default:
                    description: A refusal.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Refusal'
    /api/v1/session:
        get:
            operationId: getSession
            summary: Who is signed in on this browser.
            responses:
                '200':
                    {
                        description: The signed-in person.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } }
                    }
                default: { $ref: '#/components/responses/Refusal' }
        post:
            operationId: signIn
            summary: >-
                Signs in with the login and the password. Sets the cookie `wyo_session`. A wrong login and a wrong password
                are refused alike (`sign_in_refused`); after 5 failures in 15 minutes for one login or one address the answer
                is `too_many_attempts` with `params.minutes`.
            requestBody:
                required: true
                content: { application/json: { schema: { $ref: '#/components/schemas/SignIn' } } }
            responses:
                '200':
                    {
                        description: Signed in.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } }
                    }
                default: { $ref: '#/components/responses/Refusal' }
        delete:
            operationId: signOut
            summary: Ends the session of this browser.
            responses:
                '204': { description: Signed out. }
                default: { $ref: '#/components/responses/Refusal' }
    /api/v1/sessions:
        delete:
            operationId: signOutEverywhere
            summary: Ends every session of the owner, this browser's included.
            responses:
                '204': { description: Every session ended. }
                default: { $ref: '#/components/responses/Refusal' }
    /api/v1/account/password:
        put:
            operationId: changePassword
            summary: >-
                Sets a new password after checking the current one, and ends every other session. Refusals lie on the fields:
                `currentPassword` / `wrong`, `newPassword` / `too_short` (`params.min`), `newPassword` / `same_as_current`.
            requestBody:
                required: true
                content: { application/json: { schema: { $ref: '#/components/schemas/PasswordChange' } } }
            responses:
                '204': { description: Changed. }
                default: { $ref: '#/components/responses/Refusal' }
    /api/v1/settings:
        get:
            operationId: getSettings
            summary: Every setting of the settings registry, by group, with its value, default and limits.
            responses:
                '200':
                    {
                        description: The settings.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/SettingsList' } } }
                    }
                default: { $ref: '#/components/responses/Refusal' }
    /api/v1/settings/{group}:
        put:
            operationId: saveSettingsGroup
            summary: >-
                Saves the values of one group. A value outside its limits is refused with an issue whose path is the
                setting's key (`out_of_range` with `params.min` and `params.max`, or `wrong_kind`).
            parameters:
                - { name: group, in: path, required: true, schema: { type: string } }
            requestBody:
                required: true
                content: { application/json: { schema: { $ref: '#/components/schemas/SettingsValues' } } }
            responses:
                '200':
                    {
                        description: The group as saved.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/SettingsGroup' } } }
                    }
                default: { $ref: '#/components/responses/Refusal' }
    /api/v1/installation:
        get:
            operationId: getInstallation
            summary: The state of the installation shown on «Обзор» - version, updates, certificate, the last copy.
            responses:
                '200':
                    {
                        description: The state.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/Installation' } } }
                    }
                default: { $ref: '#/components/responses/Refusal' }
    /api/v1/updates/check:
        post:
            operationId: requestUpdateCheck
            summary: Asks the updater to look for a newer release now (it installs nothing).
            responses:
                '202':
                    {
                        description: Asked.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateRequest' } } }
                    }
                default: { $ref: '#/components/responses/Refusal' }
    /api/v1/updates/install:
        post:
            operationId: requestUpdateInstall
            summary: >-
                Asks the updater to install a newer release now, even with automatic updates off and even a version that
                failed before.
            responses:
                '202':
                    {
                        description: Asked.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateRequest' } } }
                    }
                default: { $ref: '#/components/responses/Refusal' }
    /api/v1/backups:
        get:
            operationId: listBackups
            summary: The copies of the database kept on the server, newest first.
            responses:
                '200':
                    {
                        description: The copies.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/BackupList' } } }
                    }
                default: { $ref: '#/components/responses/Refusal' }
        post:
            operationId: createBackup
            summary: Writes a copy of the database now and keeps the newest seven.
            responses:
                '201':
                    {
                        description: The copy written.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/Backup' } } }
                    }
                default: { $ref: '#/components/responses/Refusal' }
    /api/v1/notices:
        get:
            operationId: listNotices
            summary: What needs the owner's attention now, from every notice source (the bell).
            responses:
                '200':
                    {
                        description: The notices.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/NoticeList' } } }
                    }
                default: { $ref: '#/components/responses/Refusal' }
    /api/v1/marketplaces:
        get:
            operationId: listMarketplaces
            summary: >-
                Every marketplace adapter the wyo server holds - its code, colour mark, the fields of its key form and the
                parts of the adapter contract it supports. The interface draws the key form, the marks and the columns that
                exist only for some capability from this list, never from a marketplace's name.
            responses:
                '200':
                    {
                        description: The adapters.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/MarketplaceList' } } }
                    }
                default: { $ref: '#/components/responses/Refusal' }
    /api/v1/accounts:
        get:
            operationId: listAccounts
            summary: The seller's marketplace accounts, in the order they were added.
            responses:
                '200':
                    {
                        description: The accounts.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/AccountList' } } }
                    }
                default: { $ref: '#/components/responses/Refusal' }
        post:
            operationId: createAccount
            summary: >-
                Adds an account after checking its key (the contract part `key.check`). The key is stored only in the
                secret store and never sent back. Refusals lie on the fields: `name` / `required`; `key.<field>` /
                `required`, `key_unreadable`, `key_expired`, `key_type_not_accepted` (`params.type`: `base`, `service`),
                `category_missing` (`params.category`), `key_refused` (the marketplace answered 401), `profile_mismatch`;
                without a field: `no_connection`, `marketplace_busy` (the marketplace answered that its limit of requests
                is met; `params.retryAfterSeconds` when it named the wait), `marketplace_unknown`.
            requestBody:
                required: true
                content: { application/json: { schema: { $ref: '#/components/schemas/AccountCreate' } } }
            responses:
                '201':
                    {
                        description: The account as added.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/Account' } } }
                    }
                default: { $ref: '#/components/responses/Refusal' }
    /api/v1/accounts/{id}:
        parameters:
            - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        get:
            operationId: getAccount
            summary: One account.
            responses:
                '200':
                    {
                        description: The account.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/Account' } } }
                    }
                default: { $ref: '#/components/responses/Refusal' }
        patch:
            operationId: updateAccount
            summary: >-
                Changes the account's name or its hours to hand an order over. Refusals: `name` / `required`,
                `deadlineHours` / `out_of_range` (`params.min`, `params.max`).
            requestBody:
                required: true
                content: { application/json: { schema: { $ref: '#/components/schemas/AccountChange' } } }
            responses:
                '200':
                    {
                        description: The account as changed.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/Account' } } }
                    }
                default: { $ref: '#/components/responses/Refusal' }
        delete:
            operationId: deleteAccount
            summary: >-
                Deletes an account from which no order ever came; any other is refused with `account_has_orders` and can
                only be switched off.
            responses:
                '204': { description: Deleted. }
                default: { $ref: '#/components/responses/Refusal' }
    /api/v1/accounts/{id}/key:
        parameters:
            - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        put:
            operationId: replaceAccountKey
            summary: >-
                Replaces the account's key after the same check as an added one. A key of another seller profile is refused
                with `key.<field>` / `other_seller`, so an account's orders never change owner.
            requestBody:
                required: true
                content: { application/json: { schema: { $ref: '#/components/schemas/AccountKey' } } }
            responses:
                '200':
                    {
                        description: The account with its new key's last four characters.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/Account' } } }
                    }
                default: { $ref: '#/components/responses/Refusal' }
    /api/v1/accounts/{id}/check:
        parameters:
            - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        post:
            operationId: checkAccount
            summary: Checks the stored key again now; the account's state follows the answer.
            responses:
                '200':
                    {
                        description: The account after the check.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/Account' } } }
                    }
                default: { $ref: '#/components/responses/Refusal' }
    /api/v1/accounts/{id}/disable:
        parameters:
            - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        post:
            operationId: disableAccount
            summary: Switches the account off - nothing is asked for it, its orders stay.
            responses:
                '200':
                    {
                        description: The account.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/Account' } } }
                    }
                default: { $ref: '#/components/responses/Refusal' }
    /api/v1/accounts/{id}/enable:
        parameters:
            - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        post:
            operationId: enableAccount
            summary: Switches the account on again and checks its key.
            responses:
                '200':
                    {
                        description: The account.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/Account' } } }
                    }
                default: { $ref: '#/components/responses/Refusal' }
    /api/v1/orders:
        get:
            operationId: listOrders
            summary: >-
                The orders of every account and scheme, newest first, 50 a page. Filters: account, scheme, state, the
                period of creation (dates in the installation's time zone, both ends included) and a search by the order's
                number, or any of its products' article, barcode or product number.
            parameters:
                - { name: account, in: query, schema: { type: integer, format: int64 } }
                - { name: scheme, in: query, schema: { $ref: '#/components/schemas/OrderScheme' } }
                - { name: state, in: query, schema: { $ref: '#/components/schemas/OrderState' } }
                - { name: from, in: query, schema: { type: string, format: date } }
                - { name: to, in: query, schema: { type: string, format: date } }
                - { name: q, in: query, schema: { type: string } }
                - { name: attention, in: query, schema: { type: boolean }, description: Only the orders that need the owner. }
                - name: test
                  in: query
                  schema: { type: string, enum: [only, none] }
                  description: '`only` - only the test orders; `none` - without them.'
                - { name: page, in: query, schema: { type: integer, minimum: 1 } }
            responses:
                '200':
                    {
                        description: One page of orders.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/OrderList' } } }
                    }
                default: { $ref: '#/components/responses/Refusal' }
    /api/v1/orders/{id}:
        parameters:
            - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        get:
            operationId: getOrder
            summary: One order with the history of its states and the orders the marketplace split it into.
            responses:
                '200':
                    {
                        description: The order.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/OrderDetails' } } }
                    }
                default: { $ref: '#/components/responses/Refusal' }
    /api/v1/sync/refresh:
        get:
            operationId: getRefresh
            summary: When the order list was last refreshed by the owner and when «Обновить» may be pressed again.
            responses:
                '200':
                    {
                        description: The refresh state.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/RefreshState' } } }
                    }
                default: { $ref: '#/components/responses/Refusal' }
        post:
            operationId: refreshOrders
            summary: >-
                Starts the three order jobs of every working account at once. Answered at most once in 5 minutes; earlier
                it is refused with `too_soon` and `params.nextAllowedAt`.
            responses:
                '202':
                    {
                        description: Started.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/RefreshState' } } }
                    }
                default: { $ref: '#/components/responses/Refusal' }
    /api/v1/journal:
        get:
            operationId: listJournal
            summary: >-
                The journal of every request the wyo server sent to a marketplace or to the fulfilment centre, newest first, 50 a page. Never a key,
                a query or a body.
            parameters:
                - { name: account, in: query, schema: { type: integer, format: int64 } }
                - { name: outcome, in: query, schema: { $ref: '#/components/schemas/JournalOutcome' } }
                - {
                      name: target,
                      in: query,
                      schema: { type: string },
                      description: 'Where a request went - a marketplace''s code, or `fulfilment` for the fulfilment centre.'
                  }
                - { name: from, in: query, schema: { type: string, format: date } }
                - { name: to, in: query, schema: { type: string, format: date } }
                - { name: page, in: query, schema: { type: integer, minimum: 1 } }
            responses:
                '200':
                    {
                        description: One page of the journal.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/JournalList' } } }
                    }
                default: { $ref: '#/components/responses/Refusal' }
    /api/v1/overview/marketplaces:
        get:
            operationId: getMarketplacesOverview
            summary: The cards of «Обзор» about accounts and orders.
            responses:
                '200':
                    {
                        description: The counts.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/MarketplacesOverview' } } }
                    }
                default: { $ref: '#/components/responses/Refusal' }
    /api/v1/external-api:
        get:
            operationId: getExternalApi
            summary: >-
                The setting «Внешний API» - the address of a fulfilment centre's system and the last four characters of
                its key, the state of the last check and what the fulfilment centre answered. Empty by default.
            responses:
                '200':
                    {
                        description: The setting.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/ExternalApi' } } }
                    }
                default: { $ref: '#/components/responses/Refusal' }
        put:
            operationId: putExternalApi
            summary: >-
                «Проверить и сохранить»: asks the fulfilment centre's system `GET /api/v1/account` with the key and saves
                the address and the key only when it answers and the key may write. Refusals - `invalid_address`,
                `fc_key_refused`, `fc_read_only_key`, `fc_api_off`, `fc_forbidden`, `fc_unavailable`, `fc_no_connection`,
                `fc_unreadable`.
            requestBody:
                required: true
                content: { application/json: { schema: { $ref: '#/components/schemas/ExternalApiConnect' } } }
            responses:
                '200':
                    {
                        description: Saved and checked.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/ExternalApi' } } }
                    }
                default: { $ref: '#/components/responses/Refusal' }
        delete:
            operationId: deleteExternalApi
            summary: >-
                «Отключить»: empties the setting. From this moment nothing is sent anywhere but to the marketplaces; the
                matches, the orders' exchange states and the hand-overs are kept for when it is filled again.
            responses:
                '204': { description: Emptied. }
                default: { $ref: '#/components/responses/Refusal' }
    /api/v1/external-api/check:
        post:
            operationId: checkExternalApi
            summary: Checks the saved setting again; the answer is the setting with the new state.
            responses:
                '200':
                    {
                        description: Checked.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/ExternalApi' } } }
                    }
                default: { $ref: '#/components/responses/Refusal' }
    /api/v1/external-api/warehouses:
        get:
            operationId: getExternalApiWarehouses
            summary: >-
                Each warehouse of the seller on a marketplace beside the fulfilment centre's warehouse that stands for it,
                and the fulfilment centre's warehouses to choose from.
            responses:
                '200':
                    {
                        description: The matches.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/WarehouseMatches' } } }
                    }
                default: { $ref: '#/components/responses/Refusal' }
        put:
            operationId: putExternalApiWarehouses
            summary: Saves the matches sent; a row with no `fcWarehouse` removes its match.
            requestBody:
                required: true
                content: { application/json: { schema: { $ref: '#/components/schemas/WarehouseMatchesChange' } } }
            responses:
                '200':
                    {
                        description: The matches as saved.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/WarehouseMatches' } } }
                    }
                default: { $ref: '#/components/responses/Refusal' }
    /api/v1/external-api/marketplaces:
        get:
            operationId: getExternalApiMarketplaces
            summary: >-
                For each account, the marketplace's code in the fulfilment centre's own list (with a proposal when a code
                equals the adapter's), whether its key may write, and the adapter's hand-over settings.
            responses:
                '200':
                    {
                        description: The accounts.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/MarketplaceMatches' } } }
                    }
                default: { $ref: '#/components/responses/Refusal' }
        put:
            operationId: putExternalApiMarketplaces
            summary: >-
                Saves the rows sent: a row's `fcMarketplace` (absent - unchanged, empty - no match) and its
                `handoverSettings` (absent - unchanged).
            requestBody:
                required: true
                content: { application/json: { schema: { $ref: '#/components/schemas/MarketplaceMatchesChange' } } }
            responses:
                '200':
                    {
                        description: The accounts as saved.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/MarketplaceMatches' } } }
                    }
                default: { $ref: '#/components/responses/Refusal' }
    /api/v1/external-api/events:
        get:
            operationId: getExternalApiEvents
            summary: How the wyo server learns what the fulfilment centre did - by asking once a minute, or by notifications.
            responses:
                '200':
                    {
                        description: The events' setting.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/EventsSetting' } } }
                    }
                default: { $ref: '#/components/responses/Refusal' }
        put:
            operationId: putExternalApiEvents
            summary: >-
                Switches between asking and notifications. Switching notifications on makes the address to copy; the
                signing secret the fulfilment centre's system shows is sent with `secret` (`whsec_` and base64). Refusals
                - `invalid_secret`, `external_api_empty`.
            requestBody:
                required: true
                content: { application/json: { schema: { $ref: '#/components/schemas/EventsSettingChange' } } }
            responses:
                '200':
                    {
                        description: Saved.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/EventsSetting' } } }
                    }
                default: { $ref: '#/components/responses/Refusal' }
    /api/v1/handovers:
        get:
            operationId: listHandovers
            summary: The hand-overs the fulfilment centre asked documents for, newest first.
            responses:
                '200':
                    {
                        description: The hand-overs.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/HandoverList' } } }
                    }
                default: { $ref: '#/components/responses/Refusal' }
    /api/v1/handovers/{id}:
        parameters:
            - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        get:
            operationId: getHandover
            summary: One hand-over with the strip of its steps, its orders and its problem.
            responses:
                '200':
                    {
                        description: The hand-over.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/HandoverDetails' } } }
                    }
                default: { $ref: '#/components/responses/Refusal' }
    /api/v1/handovers/{id}/retry:
        parameters:
            - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        post:
            operationId: retryHandover
            summary: «Повторить» - goes on from the step that failed or waited. Refusal - `handover_not_retryable`.
            responses:
                '202':
                    {
                        description: Started.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/HandoverDetails' } } }
                    }
                default: { $ref: '#/components/responses/Refusal' }
    /api/v1/handovers/{id}/shipping-point:
        parameters:
            - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        get:
            operationId: getHandoverShippingPoints
            summary: >-
                The points the marketplace offers for this hand-over's batch, asked of the marketplace now, and the point
                remembered for the account. Refusal - `shipping_points_unavailable` (the batch is not made yet).
            responses:
                '200':
                    {
                        description: The points.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/ShippingPointChoice' } } }
                    }
                default: { $ref: '#/components/responses/Refusal' }
        put:
            operationId: putHandoverShippingPoint
            summary: >-
                Remembers the point for the account (for this and the next hand-overs) and goes on with the steps.
                Refusal - `shipping_point_unknown`.
            requestBody:
                required: true
                content: { application/json: { schema: { $ref: '#/components/schemas/ShippingPointPick' } } }
            responses:
                '202':
                    {
                        description: Saved; the steps go on.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/HandoverDetails' } } }
                    }
                default: { $ref: '#/components/responses/Refusal' }
    /api/v1/orders/{id}/exchange/retry:
        parameters:
            - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        post:
            operationId: retryOrderExchange
            summary: >-
                «Передать заново» - repeats the order's step that failed, for a reason the owner has removed. Refusal -
                `exchange_not_retryable`.
            responses:
                '202':
                    {
                        description: Started.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/OrderDetails' } } }
                    }
                default: { $ref: '#/components/responses/Refusal' }
    /api/v1/overview/external-api:
        get:
            operationId: getExternalApiOverview
            summary: The card «Внешний API» of «Обзор».
            responses:
                '200':
                    {
                        description: The card.,
                        content: { application/json: { schema: { $ref: '#/components/schemas/ExternalApiOverview' } } }
                    }
                default: { $ref: '#/components/responses/Refusal' }
    /hooks/fulfilment/{text}:
        parameters:
            - { name: text, in: path, required: true, schema: { type: string } }
        post:
            operationId: receiveFulfilmentNotification
            summary: >-
                A signed notification of the fulfilment centre (the Standard Webhooks scheme of
                docs/fulfilment-centre-api.md). The only address open without signing in that changes anything; it carries
                no cookie, and the signature stands in its place. Accepted only with the right address text, a right
                signature and a time no more than five minutes away; at most 256 KB. Refusals - `not_found`,
                `bad_signature`, `too_large`.
            requestBody:
                required: true
                content: { application/json: { schema: { type: object, additionalProperties: true } } }
            responses:
                '204': { description: Stored; applied afterwards. }
                default: { $ref: '#/components/responses/Refusal' }
    /hooks/marketplace/{text}:
        parameters:
            - { name: text, in: path, required: true, schema: { type: string } }
        post:
            operationId: receiveMarketplaceNotification
            summary: >-
                A marketplace's notification for one account, at the account's own address text. Open without signing in;
                accepted only from the networks the marketplace's adapter declares, at an address text the wyo server made,
                and at most 256 KB - anything else is answered `not_found`, so the address tells a stranger nothing. The
                notification is stored first and answered at once with the body the marketplace wants; a body the adapter
                cannot read is answered 400 with its reason in the marketplace's own form.
            requestBody:
                required: true
                content: { application/json: { schema: { type: object, additionalProperties: true } } }
            responses:
                '200':
                    {
                        description: "Stored; the orders it names are read afterwards. The body is the marketplace's own form.",
                        content: { application/json: { schema: { type: object, additionalProperties: true } } }
                    }
                '400':
                    {
                        description: "The body cannot be read; the reason in the marketplace's own form.",
                        content: { application/json: { schema: { type: object, additionalProperties: true } } }
                    }
                default: { $ref: '#/components/responses/Refusal' }
    /hooks/marketplace/{text}/notification:
        parameters:
            - { name: text, in: path, required: true, schema: { type: string } }
        post:
            operationId: receiveMarketplaceNotificationAtItsMethod
            summary: >-
                The same address followed by the name of the marketplace's method, `notification`: whether a marketplace
                adds it to the address the seller enters is not sourced, so both are answered alike.
            requestBody:
                required: true
                content: { application/json: { schema: { type: object, additionalProperties: true } } }
            responses:
                '200':
                    {
                        description: "Stored; the orders it names are read afterwards. The body is the marketplace's own form.",
                        content: { application/json: { schema: { type: object, additionalProperties: true } } }
                    }
                '400':
                    {
                        description: "The body cannot be read; the reason in the marketplace's own form.",
                        content: { application/json: { schema: { type: object, additionalProperties: true } } }
                    }
                default: { $ref: '#/components/responses/Refusal' }
components:
    schemas:
        KeyField:
            type: object
            additionalProperties: false
            required: [name, secret]
            properties:
                name:
                    type: string
                    description: 'The field of the key form; its texts are `marketplace.<code>.key.<name>.label` and `.help`.'
                secret: { type: boolean, description: The value is a secret - drawn as a secret box, never sent back. }
        Marketplace:
            type: object
            additionalProperties: false
            required:
                [
                    code,
                    mark,
                    keyFields,
                    capabilities,
                    handoverSettings,
                    givesDeadline,
                    exchangeFlow,
                    handoverSteps,
                    receivesNotifications
                ]
            properties:
                code:
                    type: string
                    description: "The adapter's code, e.g. `wildberries`; its texts are `marketplace.<code>.name` and `.help`."
                mark: { type: string, description: The name of the colour mark of the theme. }
                keyFields:
                    type: array
                    items: { $ref: '#/components/schemas/KeyField' }
                capabilities:
                    type: array
                    description: The parts of the adapter contract this adapter supports, e.g. `orders.new`.
                    items: { type: string }
                handoverSettings:
                    type: array
                    description: >-
                        The adapter's hand-over settings (Plan 4, «Внешний API»): a choice among `choices`, or a text when
                        there are none. Texts - `marketplace.<code>.handover.<name>.label`, `.help` and
                        `.choice.<value>`.
                    items: { $ref: '#/components/schemas/SettingField' }
                givesDeadline:
                    type: boolean
                    description: >-
                        The marketplace gives each order the moment it must be handed over by; when it does not, the deadline
                        is the order's creation plus the account's `deadlineHours`, which the owner sets.
                exchangeFlow:
                    type: string
                    enum: [confirm, pack]
                    description: >-
                        How the exchange with a fulfilment centre treats the marketplace's orders: `confirm` - the order is
                        confirmed at the marketplace when the fulfilment centre reserves it, and its label follows at once;
                        `pack` - nothing is written at the reservation, the marking codes and the packing report follow the end
                        of packing, and the labels are made afterwards.
                handoverSteps:
                    type: array
                    description: >-
                        The steps of a hand-over the adapter needs, in the order they run; the strip of a hand-over draws these
                        and no others.
                    items: { $ref: '#/components/schemas/HandoverStep' }
                receivesNotifications:
                    type: boolean
                    description: >-
                        The marketplace sends the wyo server a notification when an order appears or changes, at the address
                        of each account (`Account.notifications`); the orders are then read at once, and a safety reading
                        every 15 minutes finds whatever a notification lost.
                programHeader:
                    type: string
                    description: >-
                        A header of the marketplace's own in which every request names the program, `wyo/<version>`, beside
                        `User-Agent`; absent when the marketplace asks for none.
        Shop:
            type: object
            additionalProperties: false
            required: [number, name, scheme, apiOff]
            properties:
                number: { type: string, description: "The marketplace's own number of the shop." }
                name: { type: string }
                scheme:
                    type: string
                    description: "The shop's scheme in the marketplace's words, e.g. `FBS`; the text is `orders.scheme.<scheme>` in lower case."
                apiOff:
                    type: boolean
                    description: The marketplace has switched the shop's API off; its orders are not read.
        AccountNotifications:
            type: object
            additionalProperties: false
            required: [path, state]
            description: >-
                The account's notification address and whether notifications arrive. Only for a marketplace that sends
                them; the path is shown only to the signed-in owner.
            properties:
                path:
                    type: string
                    description: >-
                        The path of the account's own notification address on the wyo server, `/hooks/marketplace/<text>`;
                        the full address is the wyo server's own address followed by it.
                state:
                    type: string
                    enum: [waiting, working, lost]
                    description: >-
                        `waiting` - no notification has arrived yet; `working` - they arrive; `lost` - a safety reading
                        found an order change that no notification named. The text is `accounts.notifications.<state>`.
                seenAt: { type: string, format: date-time, description: When the last notification arrived. }
                lostAt:
                    { type: string, format: date-time, description: When a safety reading last found a change lost. }
        SettingField:
            type: object
            additionalProperties: false
            required: [name, choices]
            properties:
                name: { type: string }
                choices:
                    type: array
                    items: { type: string }
        MarketplaceList:
            type: object
            additionalProperties: false
            required: [marketplaces]
            properties:
                marketplaces:
                    type: array
                    items: { $ref: '#/components/schemas/Marketplace' }
        AccountState:
            type: string
            enum: [working, key_expiring, key_expired, key_refused, no_connection, disabled]
            description: 'The texts are `accounts.state.<state>` and `accounts.state.<state>.help`.'
        AccountRefusal:
            type: object
            additionalProperties: false
            required: [code, at]
            properties:
                code:
                    {
                        type: string,
                        description: "A code of the adapter's refusals; the text is `accounts.refusal.<code>`."
                    }
                at: { type: string, format: date-time }
                status: { type: integer, description: The marketplace's answer status, when there was one. }
        Account:
            type: object
            additionalProperties: false
            required:
                [
                    id,
                    marketplace,
                    name,
                    state,
                    test,
                    keyLast4,
                    missingCategories,
                    readOnly,
                    deadlineHours,
                    hasOrders,
                    createdAt
                ]
            properties:
                id: { type: integer, format: int64 }
                marketplace: { type: string, description: The adapter's code. }
                name: { type: string, description: The account's own name, given by the owner. }
                state: { $ref: '#/components/schemas/AccountState' }
                test:
                    type: boolean
                    description: A test key - the account talks only to the marketplace's sandbox.
                sellerName: { type: string, description: The seller's name as the marketplace gives it. }
                keyLast4: { type: string, description: The last four characters of the key - never more. }
                keyFields:
                    type: array
                    description: >-
                        The fields of the key that are not secret, shown in full (e.g. a client's number that tells two
                        accounts of one marketplace apart); their texts are `marketplace.<code>.key.<name>.label`.
                    items: { $ref: '#/components/schemas/ShownKeyField' }
                sellerDeliversWarehouses:
                    type: integer
                    description: >-
                        How many of the account's warehouses the seller delivers from to the buyer itself; their orders
                        are never read, because they need the buyer's address.
                expressWarehouses:
                    type: integer
                    description: How many of the account's warehouses a courier takes orders from one by one within hours.
                shops:
                    type: array
                    description: The shops of an account whose marketplace keeps several shops in one account.
                    items: { $ref: '#/components/schemas/Shop' }
                notifications: { $ref: '#/components/schemas/AccountNotifications' }
                keyType:
                    { type: string, description: "The key's type as the adapter names it, e.g. `personal`, `test`." }
                keyExpiresAt: { type: string, format: date-time }
                missingCategories:
                    type: array
                    description: Categories the key lacks that some part of the account needs, e.g. `statistics`.
                    items: { type: string }
                readOnly: { type: boolean, description: The key allows only reading. }
                deadlineHours:
                    type: integer
                    description: Hours after an order's creation by which it must be handed to the marketplace.
                lastCheckAt: { type: string, format: date-time }
                lastSuccessAt: { type: string, format: date-time, description: The last successful reading. }
                lastRefusal: { $ref: '#/components/schemas/AccountRefusal' }
                failuresInRow: { type: integer }
                hasOrders:
                    { type: boolean, description: An order came from the account; it can then only be switched off. }
                createdAt: { type: string, format: date-time }
        ShownKeyField:
            type: object
            additionalProperties: false
            required: [name, value]
            properties:
                name: { type: string }
                value: { type: string }
        AccountList:
            type: object
            additionalProperties: false
            required: [accounts]
            properties:
                accounts:
                    type: array
                    items: { $ref: '#/components/schemas/Account' }
        AccountKey:
            type: object
            additionalProperties: false
            required: [key]
            properties:
                key:
                    type: object
                    description: The key form's fields by name, as the adapter's `keyFields` lists them.
                    additionalProperties: { type: string }
        AccountCreate:
            type: object
            additionalProperties: false
            required: [marketplace, name, key]
            properties:
                marketplace: { type: string }
                name: { type: string }
                key:
                    type: object
                    additionalProperties: { type: string }
        AccountChange:
            type: object
            additionalProperties: false
            properties:
                name: { type: string }
                deadlineHours: { type: integer }
        OrderScheme:
            type: string
            enum: [fbs, fbo, express, fby]
            description: >-
                `fbs` - the seller packs the order and hands it to the marketplace; `fbo` - the goods lie in the
                marketplace's own warehouse (read-only); `express` - the seller packs the order and a courier takes it
                alone within hours (passed on as `fbs`); `fby` - the marketplace's own warehouse as Яндекс Маркет names
                it (read-only, as `fbo`). The text is `orders.scheme.<scheme>`.
        OrderState:
            type: string
            enum: [new, assembling, in_delivery, received, cancelled, unknown]
            description: "The connector's own states, the same for every marketplace; the text is `orders.state.<state>`."
        CancelledBy:
            type: string
            enum: [seller, buyer, marketplace]
            description: 'Who cancelled a cancelled order; the text is `orders.state.cancelled.<cancelledBy>`.'
        MarketplaceStatus:
            type: object
            additionalProperties: false
            description: The marketplace's own words for the state, as received.
            properties:
                seller: { type: string }
                marketplace: { type: string }
        Order:
            type: object
            additionalProperties: false
            required: [id, accountId, accountName, marketplace, scheme, number, lines, createdAt, state, marketplaceStatus, test]
            properties:
                id: { type: integer, format: int64 }
                accountId: { type: integer, format: int64 }
                accountName: { type: string }
                marketplace: { type: string }
                scheme: { $ref: '#/components/schemas/OrderScheme' }
                number: { type: string, description: The marketplace's own number of the order. }
                basket: { type: string, description: The buyer's basket number. }
                warehouse: { type: string }
                warehouseText:
                    type: string
                    description: >-
                        The marketplace's own text of the order's warehouse, given when `warehouse` is absent because the
                        warehouse cannot be told by its number (shown beside «Склад не определён»).
                lines:
                    type: array
                    description: The order's products, each with how many units; at least one.
                    items: { $ref: '#/components/schemas/OrderLine' }
                createdAt: { type: string, format: date-time }
                deadlineAt:
                    type: string
                    format: date-time
                    description: >-
                        Only for `fbs`: `shipBy` when the marketplace gave it, otherwise the creation plus the account's
                        `deadlineHours`.
                shipBy:
                    type: string
                    format: date-time
                    description: The moment the marketplace itself says the order must be handed over by.
                parentNumber:
                    type: string
                    description: The number of the order the marketplace split this one from.
                parts:
                    type: array
                    description: The numbers of the orders the marketplace split this one into; absent when it was not split.
                    items: { type: string }
                state: { $ref: '#/components/schemas/OrderState' }
                cancelledBy: { $ref: '#/components/schemas/CancelledBy' }
                marketplaceStatus: { $ref: '#/components/schemas/MarketplaceStatus' }
                updatedAt: { type: string, format: date-time }
                exchange:
                    $ref: '#/components/schemas/OrderExchange'
                    description: The exchange with the fulfilment centre; only for `fbs` orders.
                test:
                    type: boolean
                    description: >-
                        A test order, made by the seller in the marketplace's cabinet to try the connection: no buyer, no
                        money; shown and passed on, marked, and counted in no total.
        OrderLine:
            type: object
            additionalProperties: false
            required: [barcodes, quantity]
            properties:
                productId: { type: string, description: The marketplace's own product number. }
                article: { type: string, description: The seller's own code of the product. }
                name: { type: string, description: The product's name, when the marketplace gave it. }
                barcodes:
                    type: array
                    items: { type: string }
                kind: { type: string, description: The product's kind, when the marketplace gave it. }
                brand: { type: string }
                size: { type: string }
                quantity: { type: integer, minimum: 1, description: How many units of the product. }
        OrderEvent:
            type: object
            additionalProperties: false
            required: [at, state, marketplaceStatus, source]
            properties:
                at: { type: string, format: date-time }
                state: { $ref: '#/components/schemas/OrderState' }
                cancelledBy: { $ref: '#/components/schemas/CancelledBy' }
                marketplaceStatus: { $ref: '#/components/schemas/MarketplaceStatus' }
                source:
                    type: string
                    description: 'The contract part the change came from, e.g. `orders.new`, `orders.states`, `orders.feed`.'
        OrderDetails:
            type: object
            additionalProperties: false
            required: [order, events, parts]
            properties:
                order: { $ref: '#/components/schemas/Order' }
                events:
                    type: array
                    items: { $ref: '#/components/schemas/OrderEvent' }
                parts:
                    type: array
                    description: The numbers of the orders the marketplace split this one into.
                    items: { type: string }
                exchange: { $ref: '#/components/schemas/OrderExchangeDetails' }
        OrderList:
            type: object
            additionalProperties: false
            required: [orders, total, page, pageSize]
            properties:
                orders:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }
                total: { type: integer }
                page: { type: integer }
                pageSize: { type: integer }
        RefreshState:
            type: object
            additionalProperties: false
            properties:
                lastRefreshAt: { type: string, format: date-time }
                nextAllowedAt:
                    type: string
                    format: date-time
                    description: Absent when «Обновить» may be pressed now.
        JournalOutcome:
            type: string
            enum: [done, limited, refused, server_error, no_connection, key_refused]
            description: 'The text is `journal.outcome.<outcome>`.'
        JournalEntry:
            type: object
            additionalProperties: false
            required: [id, at, method, path, status, outcome, durationMs, job]
            properties:
                id: { type: integer, format: int64 }
                at: { type: string, format: date-time }
                accountId: { type: integer, format: int64 }
                accountName: { type: string }
                marketplace:
                    type: string
                    description: The adapter's code, or `fulfilment` for a request to the fulfilment centre.
                method: { type: string }
                path:
                    type: string
                    description: The path with placeholders in place of every number, e.g. `/api/v3/supplies/{supplyId}`.
                status: { type: integer, description: The answer's status; 0 when no answer came. }
                outcome: { $ref: '#/components/schemas/JournalOutcome' }
                errorCode: { type: string }
                errorText: { type: string, description: At most 500 characters, with anything secret blanked. }
                durationMs: { type: integer }
                job: { type: string, description: 'The job that sent it, e.g. `orders.new`, `key.check`, `refresh`.' }
        JournalList:
            type: object
            additionalProperties: false
            required: [entries, total, page, pageSize]
            properties:
                entries:
                    type: array
                    items: { $ref: '#/components/schemas/JournalEntry' }
                total: { type: integer }
                page: { type: integer }
                pageSize: { type: integer }
        MarketplacesOverview:
            type: object
            additionalProperties: false
            required: [accounts, attention, newOrders, assembling, overdue, unknownStates, testOrders]
            properties:
                accounts: { type: integer, description: Accounts that are not switched off. }
                attention:
                    type: integer
                    description: Accounts in a state other than `working` and `disabled`.
                newOrders: { type: integer }
                assembling: { type: integer }
                overdue: { type: integer, description: FBS orders past their deadline and not yet handed over. }
                unknownStates: { type: integer, description: Orders whose marketplace state the table does not hold. }
                testOrders:
                    type: integer
                    description: Test orders, which none of the numbers above counts.
                lastSuccessAt: { type: string, format: date-time }
        ExternalApiState:
            type: string
            enum:
                [
                    empty,
                    working,
                    key_refused,
                    read_only_key,
                    api_off,
                    forbidden,
                    unavailable,
                    no_connection,
                    unreadable
                ]
            description: >-
                The state of «Внешний API» after its last check or call; the text is `externalApi.state.<state>`. `empty`
                - not filled; the exchange works only in `working`.
        FcMarketplace:
            type: object
            additionalProperties: false
            required: [code, name]
            properties:
                code: { type: string, description: The fulfilment centre's own code of a marketplace. }
                name: { type: string, description: The name the fulfilment centre gives it. }
        ExternalApi:
            type: object
            additionalProperties: false
            required: [state, eventsMode]
            properties:
                state: { $ref: '#/components/schemas/ExternalApiState' }
                address: { type: string, description: 'The address of the fulfilment centre''s API, `https://…`.' }
                keyLast4: { type: string, description: The last four characters of the key; the key itself is never sent. }
                sellerName: { type: string, description: The name the fulfilment centre gives this seller. }
                marketplaces:
                    type: array
                    description: The marketplaces the fulfilment centre accepts orders of, as its last answer listed them.
                    items: { $ref: '#/components/schemas/FcMarketplace' }
                checkedAt: { type: string, format: date-time }
                eventsMode: { $ref: '#/components/schemas/EventsMode' }
                lastEventAt: { type: string, format: date-time }
        ExternalApiConnect:
            type: object
            additionalProperties: false
            required: [address, key]
            properties:
                address: { type: string, minLength: 1, maxLength: 500 }
                key: { type: string, minLength: 1, maxLength: 500 }
        FcWarehouse:
            type: object
            additionalProperties: false
            required: [code, name]
            properties:
                code: { type: string }
                name: { type: string }
                city: { type: string }
        WarehouseMatch:
            type: object
            additionalProperties: false
            required: [accountId, accountName, marketplace, warehouseNumber, warehouseName, autoAssembly]
            properties:
                accountId: { type: integer, format: int64 }
                accountName: { type: string }
                marketplace: { type: string }
                warehouseNumber: { type: string, description: "The marketplace's own number of the seller's warehouse." }
                warehouseName: { type: string }
                autoAssembly:
                    type: boolean
                    description: The marketplace assembles and packs the orders of this warehouse itself (automatic assembly).
                fcWarehouse: { type: string, description: "The fulfilment centre's warehouse code; absent - not matched." }
        WarehouseMatches:
            type: object
            additionalProperties: false
            required: [fcWarehouses, rows]
            properties:
                fcWarehouses:
                    type: array
                    description: The fulfilment centre's working warehouses, asked of it now; empty when it does not answer.
                    items: { $ref: '#/components/schemas/FcWarehouse' }
                rows:
                    type: array
                    items: { $ref: '#/components/schemas/WarehouseMatch' }
        WarehouseMatchesChange:
            type: object
            additionalProperties: false
            required: [rows]
            properties:
                rows:
                    type: array
                    items:
                        type: object
                        additionalProperties: false
                        required: [accountId, warehouseNumber]
                        properties:
                            accountId: { type: integer, format: int64 }
                            warehouseNumber: { type: string }
                            fcWarehouse: { type: string }
        MarketplaceMatch:
            type: object
            additionalProperties: false
            required: [accountId, accountName, marketplace, readOnly, handoverSettings]
            properties:
                accountId: { type: integer, format: int64 }
                accountName: { type: string }
                marketplace: { type: string }
                fcMarketplace: { type: string, description: "The marketplace's code in the fulfilment centre's list." }
                proposed:
                    type: string
                    description: A code of the fulfilment centre's list that equals the adapter's, offered when none is chosen.
                readOnly: { type: boolean, description: The account's key may only read; the exchange cannot write with it. }
                handoverSettings:
                    type: object
                    description: The adapter's hand-over settings (`Marketplace.handoverSettings`) by name.
                    additionalProperties: { type: string }
        MarketplaceMatches:
            type: object
            additionalProperties: false
            required: [fcMarketplaces, rows]
            properties:
                fcMarketplaces:
                    type: array
                    items: { $ref: '#/components/schemas/FcMarketplace' }
                rows:
                    type: array
                    items: { $ref: '#/components/schemas/MarketplaceMatch' }
        MarketplaceMatchesChange:
            type: object
            additionalProperties: false
            required: [rows]
            properties:
                rows:
                    type: array
                    items:
                        type: object
                        additionalProperties: false
                        required: [accountId]
                        properties:
                            accountId: { type: integer, format: int64 }
                            fcMarketplace: { type: string }
                            handoverSettings:
                                type: object
                                additionalProperties: { type: string }
        EventsMode:
            type: string
            enum: [poll, notify]
            description: '`poll` - the wyo server asks once a minute; `notify` - it receives notifications and asks every 10 minutes.'
        EventsSetting:
            type: object
            additionalProperties: false
            required: [mode]
            properties:
                mode: { $ref: '#/components/schemas/EventsMode' }
                hookUrl:
                    type: string
                    description: The wyo server's own address to copy into the fulfilment centre's system (notifications only).
                secretSaved: { type: boolean, description: The signing secret is saved; it is never sent back. }
                lastNotificationAt: { type: string, format: date-time }
                lastPingAt: { type: string, format: date-time, description: The last test notification received. }
                lastEventAt: { type: string, format: date-time }
        EventsSettingChange:
            type: object
            additionalProperties: false
            required: [mode]
            properties:
                mode: { $ref: '#/components/schemas/EventsMode' }
                secret: { type: string, maxLength: 200 }
        ExchangeState:
            type: string
            enum:
                [
                    not_sent,
                    sent,
                    held,
                    reserved,
                    label_sent,
                    packed,
                    codes_checking,
                    codes_accepted,
                    handed_over,
                    cancelled
                ]
            description: "The exchange's own state of an order; the text is `exchange.state.<state>`."
        ExchangeReason:
            type: string
            enum:
                [
                    external_api_empty,
                    marketplace_not_matched,
                    warehouse_not_matched,
                    already_on_assembly,
                    not_seller_warehouse,
                    key_read_only
                ]
            description: "Why an order is not sent; the text is `exchange.reason.<reason>`."
        Attention:
            type: string
            enum:
                [held, not_reserved_in_time, problem, codes_refused, cancelled_by_warehouse, change_waits]
            description: "Why an order needs the owner; the text is `exchange.attention.<code>`."
        Problem:
            type: object
            additionalProperties: false
            required: [code, at]
            properties:
                code: { type: string, description: "The wyo server's code of the problem; the text is `problem.<code>`." }
                params:
                    type: object
                    additionalProperties: true
                marketplaceCode: { type: string, description: "The marketplace's own code of its refusal, as received." }
                words:
                    type: string
                    description: "The marketplace's or the fulfilment centre's own words, as received (at most 300 characters)."
                at: { type: string, format: date-time }
        OrderExchange:
            type: object
            additionalProperties: false
            required: [state]
            properties:
                state: { $ref: '#/components/schemas/ExchangeState' }
                reason: { $ref: '#/components/schemas/ExchangeReason' }
                attention: { $ref: '#/components/schemas/Attention' }
                problem: { $ref: '#/components/schemas/Problem' }
        HeldReason:
            type: object
            additionalProperties: false
            required: [code]
            properties:
                code:
                    type: string
                    description: "The fulfilment centre's reason code; the text is `exchange.held.<code>`."
                params:
                    type: object
                    additionalProperties: true
        CodeVerdict:
            type: object
            additionalProperties: false
            required: [identifier, verdict]
            description: The verdict on one identifier of an order. The code itself is never sent to the browser.
            properties:
                identifier: { type: string, description: "The text is `exchange.identifier.<identifier>`." }
                verdict:
                    type: string
                    enum: [accepted, not_required, pending, unfinished, missing, refused]
                    description: "The text is `exchange.verdict.<verdict>`."
                words: { type: string, description: "The marketplace's own word for the verdict, as received." }
                units: { type: integer, description: How many units' codes were sent. }
        ExchangeEvent:
            type: object
            additionalProperties: false
            required: [at, state]
            properties:
                at: { type: string, format: date-time }
                state: { $ref: '#/components/schemas/ExchangeState' }
                code:
                    type: string
                    description: "What happened, e.g. `sent`, `held`, `label_sent`, `codes_refused`; the text is `exchange.event.<code>`."
        OrderExchangeDetails:
            type: object
            additionalProperties: false
            required: [state, heldReasons, verdicts, history, retryable, parcels]
            properties:
                state: { $ref: '#/components/schemas/ExchangeState' }
                reason: { $ref: '#/components/schemas/ExchangeReason' }
                attention: { $ref: '#/components/schemas/Attention' }
                problem: { $ref: '#/components/schemas/Problem' }
                fcNumber: { type: string, description: "The order's number at the fulfilment centre." }
                heldReasons:
                    type: array
                    items: { $ref: '#/components/schemas/HeldReason' }
                verdicts:
                    type: array
                    items: { $ref: '#/components/schemas/CodeVerdict' }
                cancelAnswer:
                    type: string
                    enum: [cancelled, waiting, needs_person, handed_over]
                    description: "The fulfilment centre's answer to a cancellation passed on; the text is `exchange.cancel.<answer>`."
                history:
                    type: array
                    items: { $ref: '#/components/schemas/ExchangeEvent' }
                retryable: { type: boolean, description: «Передать заново» may be pressed. }
                parcels:
                    type: array
                    description: The order's parcels in the order of their numbers; none before the packing is known.
                    items: { $ref: '#/components/schemas/OrderParcel' }
        OrderParcel:
            type: object
            additionalProperties: false
            required: [number, marketplaceNumber, labelSent]
            properties:
                number: { type: integer, minimum: 1, description: The parcel's number in its order, from 1. }
                marketplaceNumber:
                    type: string
                    description: >-
                        The marketplace's own number of the part the parcel became: the order's own number when the marketplace
                        does not split an order.
                labelSent: { type: boolean, description: The parcel's label was attached to the order at the fulfilment centre. }
                labelSentAt: { type: string, format: date-time }
        HandoverState:
            type: string
            enum: [working, waiting, problem, documents_sent, withdrawn, completed]
            description: "The text is `handovers.state.<state>`."
        HandoverStep:
            type: string
            enum: [batch, move, boxes, shipping, close, documents]
            description: "The text is `handovers.step.<step>`."
        Handover:
            type: object
            additionalProperties: false
            required: [id, number, day, state, step, batches, orders, boxes, requestedAt]
            properties:
                id: { type: integer, format: int64 }
                number: { type: string, description: "The fulfilment centre's number of the hand-over." }
                day: { type: string, format: date }
                marketplace: { type: string, description: "The adapter's code, when the hand-over's orders are known." }
                state: { $ref: '#/components/schemas/HandoverState' }
                step: { $ref: '#/components/schemas/HandoverStep' }
                batches:
                    type: array
                    description: "The marketplace's numbers of the hand-over's batches (Wildberries' supplies)."
                    items: { type: string }
                orders: { type: integer }
                boxes: { type: integer, description: Transport boxes the fulfilment centre named. }
                problem: { $ref: '#/components/schemas/Problem' }
                requestedAt: { type: string, format: date-time }
                updatedAt: { type: string, format: date-time }
        HandoverList:
            type: object
            additionalProperties: false
            required: [handovers]
            properties:
                handovers:
                    type: array
                    items: { $ref: '#/components/schemas/Handover' }
        HandoverStepState:
            type: object
            description: One of the hand-over's declared steps - the ones the marketplace's adapter needs, in the order they run.
            additionalProperties: false
            required: [step, state]
            properties:
                step: { $ref: '#/components/schemas/HandoverStep' }
                state: { type: string, enum: [done, now, waiting, failed, todo] }
        HandoverDetails:
            type: object
            additionalProperties: false
            required: [handover, steps, orderList, retryable, needsShippingPoint, closed]
            properties:
                handover: { $ref: '#/components/schemas/Handover' }
                steps:
                    type: array
                    items: { $ref: '#/components/schemas/HandoverStepState' }
                orderList:
                    type: array
                    items:
                        type: object
                        additionalProperties: false
                        required: [id, number]
                        properties:
                            id: { type: integer, format: int64 }
                            number: { type: string }
                retryable: { type: boolean }
                needsShippingPoint: { type: boolean, description: The owner must pick the shipping point. }
                closed: { type: boolean, description: The batch is closed at the marketplace; nothing can be undone. }
        ShippingPoint:
            type: object
            additionalProperties: false
            required: [id, name]
            properties:
                id: { type: string }
                name: { type: string }
                address: { type: string }
        ShippingPointChoice:
            type: object
            additionalProperties: false
            required: [points]
            properties:
                points:
                    type: array
                    items: { $ref: '#/components/schemas/ShippingPoint' }
                chosen: { type: string, description: The point remembered for the account. }
        ShippingPointPick:
            type: object
            additionalProperties: false
            required: [point]
            properties:
                point: { type: string, minLength: 1 }
        ExternalApiOverview:
            type: object
            additionalProperties: false
            required: [state, attention, handoversWaiting]
            properties:
                state: { $ref: '#/components/schemas/ExternalApiState' }
                lastEventAt: { type: string, format: date-time }
                attention: { type: integer, description: Orders that need the owner (the filter «Требуют внимания»). }
                handoversWaiting: { type: integer, description: Hand-overs that wait or have a problem. }
        Meta:
            type: object
            additionalProperties: false
            required: [name, version, mode]
            properties:
                name:
                    type: string
                    description: Always `wyo`.
                version:
                    type: string
                    description: The release version, or `dev` for a build that was not stamped.
                mode:
                    type: string
                    enum: [release, development, test]
                    description: >-
                        `release` for a released wyo server; `development` and `test` only in a build made with the
                        `wyotest` tag.
        Refusal:
            type: object
            additionalProperties: false
            required: [error]
            properties:
                error:
                    type: object
                    additionalProperties: false
                    required: [code]
                    properties:
                        code:
                            type: string
                        params:
                            type: object
                            additionalProperties: true
                        issues:
                            type: array
                            items:
                                type: object
                                additionalProperties: false
                                required: [path, code]
                                properties:
                                    path:
                                        type: string
                                    code:
                                        type: string
        SignIn:
            type: object
            additionalProperties: false
            required: [login, password]
            properties:
                login: { type: string }
                password: { type: string }
        Session:
            type: object
            additionalProperties: false
            required: [login, mustChangePassword, idleMinutes]
            properties:
                login: { type: string }
                mustChangePassword: { type: boolean }
                idleMinutes:
                    type: integer
                    description: After how many minutes without the person's own action the session ends.
        PasswordChange:
            type: object
            additionalProperties: false
            required: [currentPassword, newPassword]
            properties:
                currentPassword: { type: string }
                newPassword: { type: string }
        Setting:
            type: object
            additionalProperties: false
            required: [key, kind, value, defaultValue]
            properties:
                key:
                    type: string
                    description: '`<group>.<name>`; the texts are `settings.<key>.label` and `settings.<key>.help`.'
                kind: { type: string, enum: [boolean, integer] }
                value: { description: A boolean or an integer, by `kind`. }
                defaultValue: { description: A boolean or an integer, by `kind`. }
                min: { type: integer }
                max: { type: integer }
        SettingsGroup:
            type: object
            additionalProperties: false
            required: [id, settings]
            properties:
                id: { type: string }
                settings:
                    type: array
                    items: { $ref: '#/components/schemas/Setting' }
        SettingsList:
            type: object
            additionalProperties: false
            required: [groups]
            properties:
                groups:
                    type: array
                    items: { $ref: '#/components/schemas/SettingsGroup' }
        SettingsValues:
            type: object
            additionalProperties: false
            required: [values]
            properties:
                values:
                    type: object
                    description: Setting keys of the group with their new values.
                    additionalProperties: true
        Backup:
            type: object
            additionalProperties: false
            required: [name, size, createdAt]
            properties:
                name: { type: string, description: 'The file name in `backups/`, e.g. `wyo-2026-11-17.db`.' }
                size: { type: integer, format: int64, description: The size in bytes. }
                createdAt: { type: string, format: date-time }
        BackupList:
            type: object
            additionalProperties: false
            required: [backups]
            properties:
                backups:
                    type: array
                    items: { $ref: '#/components/schemas/Backup' }
        Installation:
            type: object
            additionalProperties: false
            required: [version, updates, certificate, backups]
            properties:
                version: { type: string }
                updates:
                    type: object
                    additionalProperties: false
                    required: [auto, requested]
                    properties:
                        auto: { type: boolean }
                        lastCheckAt: { type: string, format: date-time }
                        latestVersion: { type: string, description: The newest version the last look found. }
                        waitingVersion: { type: string, description: A newer version that waits to be installed. }
                        failedVersion: { type: string, description: A version whose update failed and was put back. }
                        requested:
                            type: boolean
                            description: A request of the owner waits for the updater.
                certificate:
                    type: object
                    additionalProperties: false
                    required: [mode, state]
                    properties:
                        mode:
                            type: string
                            enum: [automatic, proxy, none]
                            description: >-
                                `automatic` - the wyo server obtains its certificate; `proxy` - a web server in front holds
                                it; `none` - plain http (development and tests only).
                        state: { type: string, enum: [ok, pending, failed, not_applicable] }
                        domain: { type: string }
                        notAfter: { type: string, format: date-time }
                        lastError: { type: string, description: 'A code: `dns`, `ports`, `authority`, `other`.' }
                backups:
                    type: object
                    additionalProperties: false
                    required: [state]
                    properties:
                        state: { type: string, enum: [ok, old, failed, none] }
                        last: { $ref: '#/components/schemas/Backup' }
        UpdateRequest:
            type: object
            additionalProperties: false
            required: [requested]
            properties:
                requested: { type: string, enum: [check, install] }
        Notice:
            type: object
            additionalProperties: false
            required: [id, source, code, tone]
            properties:
                id: { type: string, description: Stable while the cause lasts. }
                source: { type: string, enum: [updates, certificate, backups, accounts, external_api] }
                code: { type: string, description: 'The text is `notices.<code>`.' }
                tone: { type: string, enum: [ok, wait, warn, stop, info] }
                params:
                    type: object
                    additionalProperties: true
                at: { type: string, format: date-time }
        NoticeList:
            type: object
            additionalProperties: false
            required: [notices]
            properties:
                notices:
                    type: array
                    items: { $ref: '#/components/schemas/Notice' }
    responses:
        Refusal:
            description: A refusal - a code with parameters; the interface words it.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Refusal'
